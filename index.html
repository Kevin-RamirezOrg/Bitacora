<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1C2723" id="themeColor">
<script>
// Tema antes del primer pintado, para que en modo claro no se vea un destello oscuro. applyTheme() lo repite al cargar.
(function(){try{var d=document.documentElement,t=localStorage.getItem('bitacora.theme')||'auto',p=localStorage.getItem('bitacora.palette');
if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';d.setAttribute('data-theme',t);
if(p&&p!=='pizarra')d.setAttribute('data-palette',p);}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();
</script>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Bitácora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&family=Lora:wght@500;600;700&display=swap">
<style>
/* Pizarra: chalkboard green, chalk-white type, one pastel per subject. Dark first; light = whiteboard. */
:root{
  color-scheme:dark;
  --bg:#1C2723; --surface:#24322D; --surface-2:#2D3D37; --surface-3:#384A42;
  --line:#33453E; --line-strong:#7D938A;
  --ink:#EEF1E8; --ink-2:#D3DBD0; --muted:#A9B7AD;
  --accent:#F2D67A; --on-accent:#1C2723; --accent-ink:#F2D67A; --accent-soft:rgba(242,214,122,.16);
  --danger:#FF9187; --danger-soft:rgba(255,145,135,.14); --ok:#8FD9A8; --warn:#F5C26B;
  --scrim:rgba(6,12,10,.62); --shadow:0 14px 36px rgba(0,0,0,.45);
  --c0:#F28B82; --c1:#F5B987; --c2:#F2D67A; --c3:#A8DDB5; --c4:#8FD5CF; --c5:#9CC7E8; --c6:#C9B6F0; --c7:#F2A7B8; --c8:#C3CCC5;
  --tc0:#FF9C93; --tc1:#F8BE86; --tc2:#9FE0B1; --tc3:#9DCBF0; --tc4:#CDB9F5; --tc5:#F5A9C0;
  --hc0:rgba(242,214,122,.30); --hc1:rgba(143,217,168,.26); --hc2:rgba(156,199,232,.26); --hc3:rgba(242,167,184,.26); --hc4:rgba(245,185,135,.28);
  --sx-k:#C9B6F0; --sx-s:#A8DDB5; --sx-n:#F5B987; --sx-c:#8C9C92; --sx-f:#9CC7E8; --sx-t:#F2D67A; --sx-a:#8FD5CF;
  --f-display:"Lora", Georgia, "Times New Roman", serif;
  --f-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-pill:999px;
  --tab-h:68px;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#F2F4F1; --surface:#FFFFFF; --surface-2:#E7ECE6; --surface-3:#DAE1D9;
  --line:#DCE2DB; --line-strong:#76877E;
  --ink:#16201C; --ink-2:#2C3933; --muted:#55655D;
  --accent:#1D5C46; --on-accent:#FFFFFF; --accent-ink:#1D5C46; --accent-soft:rgba(29,92,70,.12);
  --danger:#C42B21; --danger-soft:rgba(196,43,33,.10); --ok:#1F7A4D; --warn:#9A6200;
  --scrim:rgba(18,28,24,.45); --shadow:0 14px 34px rgba(22,32,28,.16);
  --c0:#D23A31; --c1:#C25E0C; --c2:#9A7400; --c3:#1E8553; --c4:#0B7C79; --c5:#1F63C4; --c6:#6743D6; --c7:#BE2F67; --c8:#5F6E66;
  --tc0:#C42B21; --tc1:#9E4A00; --tc2:#176B41; --tc3:#1D5FBF; --tc4:#6240CF; --tc5:#B62A61;
  --hc0:rgba(255,214,10,.42); --hc1:rgba(48,164,108,.26); --hc2:rgba(0,144,255,.20); --hc3:rgba(214,64,159,.20); --hc4:rgba(247,107,21,.24);
  --sx-k:#6240CF; --sx-s:#1C7A4B; --sx-n:#B35400; --sx-c:#64726A; --sx-f:#1D5FBF; --sx-t:#9A6200; --sx-a:#0B7C79;
}

/* El modo (oscuro o claro) siempre llega resuelto en data-theme: "Automático" lo decide el script del <head> y applyTheme().
   Así cada paleta tiene un solo bloque oscuro y uno claro. */
/* Palette: Uva (purple). Same structure as Pizarra; the light variant wins by higher specificity. */
:root[data-palette="uva"]{ --bg:#221B2B; --surface:#2B2236; --surface-2:#352A42; --surface-3:#40334F; --line:#3B3048; --line-strong:#8F80A4; --ink:#F1EDF5; --ink-2:#D9D1E3; --muted:#B3A7C2; --accent:#C9AEFF; --on-accent:#221B2B; --accent-ink:#C9AEFF; --accent-soft:rgba(201,174,255,.17); --scrim:rgba(12,8,18,.62); }
:root[data-palette="uva"][data-theme="light"]{ color-scheme:light; --bg:#F5F2F8; --surface:#FFFFFF; --surface-2:#ECE6F2; --surface-3:#DFD7E8; --line:#E2DAEA; --line-strong:#7F7196; --ink:#1E1828; --ink-2:#352C42; --muted:#5F5471; --accent:#6A3FC2; --on-accent:#FFFFFF; --accent-ink:#6A3FC2; --accent-soft:rgba(106,63,194,.12); --scrim:rgba(24,16,34,.45); }
/* Paleta: Noche (casi negra y neutra, con acento azul). */
:root[data-palette="noche"]{ --bg:#131314; --surface:#1C1C1E; --surface-2:#262628; --surface-3:#323235; --line:#2C2C2F; --line-strong:#85858E; --ink:#EDEDEF; --ink-2:#CFCFD4; --muted:#A6A6AE; --accent:#A8C7FA; --on-accent:#0B1A33; --accent-ink:#A8C7FA; --accent-soft:rgba(168,199,250,.16); --scrim:rgba(0,0,0,.66); --sx-c:#8E8E97; }
:root[data-palette="noche"][data-theme="light"]{ color-scheme:light; --bg:#F4F4F5; --surface:#FFFFFF; --surface-2:#E9E9EC; --surface-3:#DCDCE0; --line:#DFDFE3; --line-strong:#74747C; --ink:#18181B; --ink-2:#2E2E33; --muted:#585860; --accent:#2452B5; --on-accent:#FFFFFF; --accent-ink:#2452B5; --accent-soft:rgba(36,82,181,.12); --scrim:rgba(18,18,22,.45); --sx-c:#6C6C74; }

*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%;background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
::placeholder{color:var(--muted);opacity:1}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
svg{flex:none}

/* ---------- App frame ---------- */
.app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.pad{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;width:100%}

/* ---------- Tab bar ---------- */
.tabbar{flex:none;position:relative;z-index:6;display:flex;align-items:center;justify-content:space-around;height:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));padding:0 max(6px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(6px,env(safe-area-inset-left,0px));background:var(--bg);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:64px;height:56px;border-radius:var(--r-md);font-size:12px;font-weight:600;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .tab-ic{background:var(--accent-soft);color:var(--accent-ink)}
.tab-ic{width:52px;height:30px;border-radius:var(--r-pill);display:grid;place-items:center}
.tab.main{min-width:72px;justify-content:flex-end;padding-bottom:2px}
.tab.main .tab-ic{width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--on-accent);margin-top:-26px;border:3px solid var(--bg);box-shadow:0 8px 22px rgba(0,0,0,.35)}
.tab.main .tab-ic svg{width:28px;height:28px}
.tab.main[aria-current="page"] .tab-ic{background:var(--accent);color:var(--on-accent);box-shadow:0 0 0 3px var(--accent-soft),0 8px 22px rgba(0,0,0,.35)}
.fab{position:absolute;right:max(18px,env(safe-area-inset-right,0px));bottom:18px;z-index:5;width:58px;height:58px;border-radius:18px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.35)}
.fab svg{width:28px;height:28px}
.app.in-editor .tabbar{display:none}
/* El chat de Kell ocupa toda la pantalla, como el editor: sin barra inferior y con flecha para volver. */
.app.in-chat .tabbar{display:none}
.app.in-chat .chat-comp{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.app.in-chat .dict-bar:not([hidden]){padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
.chat-back{margin-left:-8px;color:var(--accent-ink)}
/* Cambio de sección al deslizar: la pantalla nueva entra desde el lado hacia el que se deslizó. */
.screen.go-l{animation:goL .2s ease-out}
.screen.go-r{animation:goR .2s ease-out}
@keyframes goL{from{transform:translateX(32px);opacity:.25}to{transform:none;opacity:1}}
@keyframes goR{from{transform:translateX(-32px);opacity:.25}to{transform:none;opacity:1}}

/* ---------- Headers ---------- */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-top:14px;padding-bottom:6px}
.date{font-size:14px;color:var(--muted);font-weight:500}
.big{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.15;margin:2px 0 0;letter-spacing:-.01em;text-wrap:balance}
.chalk{position:relative;display:inline-block}
.chalk::after{content:"";position:absolute;left:-2px;right:-8px;bottom:-5px;height:6px;border-radius:6px;background:var(--accent);opacity:.9;transform:rotate(-1.4deg)}
.page-h{display:flex;align-items:center;gap:6px;min-height:56px;padding-top:6px;padding-bottom:6px}
.page-h h1{font-family:var(--f-display);font-weight:700;font-size:26px;margin:0;line-height:1.2;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb{font-size:13px;color:var(--muted);font-weight:500;margin-bottom:-2px}

/* ---------- Controls ---------- */
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink);position:relative;flex:none}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn.solid{background:var(--surface-2);border:1px solid var(--line-strong)}
.icon-btn svg{width:22px;height:22px}
.status-dot{position:absolute;right:6px;top:6px;width:10px;height:10px;border-radius:50%;border:2px solid var(--bg);background:var(--muted)}
.status-dot.ok{background:var(--ok)}.status-dot.warn{background:var(--warn)}.status-dot.err{background:var(--danger)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r-pill);font-weight:600;font-size:15px;white-space:nowrap;border:1.5px solid transparent}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.secondary{background:var(--surface-2);color:var(--ink);border-color:var(--line-strong)}
.btn.ghost{color:var(--accent-ink);padding:0 10px}
.btn.danger{background:var(--danger);color:#1A0E0C}
:root[data-theme="light"] .btn.danger{color:#fff}
.btn.wide{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.link{color:var(--accent-ink);font-weight:600;font-size:15px;min-height:44px;display:inline-flex;align-items:center;padding:0 4px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field > label{font-size:14px;font-weight:600;color:var(--ink-2)}
.input,.select,.textarea{width:100%;min-height:48px;border-radius:var(--r-md);background:var(--surface-2);border:1.5px solid var(--line-strong);padding:10px 14px;font-size:16px}
.textarea{min-height:140px;resize:vertical;font-family:var(--f-mono);font-size:14px;line-height:1.55}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--accent)}
.search-field{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;border-radius:var(--r-pill);background:var(--surface);border:1.5px solid var(--line-strong);padding:0 16px;color:var(--muted);font-size:16px;text-align:left}
.search-field svg{width:20px;height:20px;color:var(--ink-2)}
input.search-field{color:var(--ink)}
input.search-field::placeholder{color:var(--muted)}
.seg{display:inline-flex;background:var(--surface-2);border:1.5px solid var(--line-strong);border-radius:var(--r-pill);padding:3px;gap:2px}
.seg button{min-height:38px;padding:0 14px;border-radius:var(--r-pill);font-size:14px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

/* ---------- Sections ---------- */
.sec{margin-top:26px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-h h2{font-family:var(--f-display);font-weight:600;font-size:21px;margin:0}
.note-bar{margin-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.note-bar.alert{background:var(--danger-soft);border-color:var(--danger);color:var(--ink)}
.note-bar .link{min-height:32px}

/* Hoy */
.hoy{border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);padding:16px;display:flex;gap:14px;align-items:flex-start}
.hoy-ic{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.hoy p{margin:0;color:var(--ink-2);font-size:15px}
.hoy small{display:block;margin-top:6px;color:var(--muted);font-size:13px}

.hoy-card{margin-top:12px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);padding:14px 14px 12px}
.hoy-card:first-of-type{margin-top:0}
.hoy-card h3{margin:0 0 2px;font-size:16px;font-weight:600}
.hoy-card .sub{margin:0 0 10px;font-size:13px;color:var(--ink-2)}
.hoy-card .res{margin-top:0;background:transparent;border:0;border-radius:0}
.hoy-card .res-row{padding:10px 0}
.hoy-more{margin:8px 0 0;font-size:13px;color:var(--ink-2)}
/* Urgente: filas de dos líneas. La casilla marca la tarea como hecha; el resto de la fila abre Notion. */
.urg{display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--line)}
.urg:last-child{border-bottom:0}
.urg-chk{width:44px;height:44px;display:grid;place-items:center;flex:none;margin-left:-10px}
.urg-chk i{width:22px;height:22px;border-radius:7px;border:2px solid var(--line-strong);display:grid;place-items:center;color:transparent}
.urg-chk i svg{width:15px;height:15px}
.urg-chk[aria-pressed="true"] i{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.urg-chk:disabled{opacity:.6}
.urg-a{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 0;color:inherit;text-decoration:none}
.urg-a .res-t b,.urg-a .res-t span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.urg-a .due{margin-top:0;white-space:nowrap;flex:none}
.urg.done .res-t b{text-decoration:line-through;color:var(--muted)}
.rp-go{margin-left:auto}
.load{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end}
.load-col{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.load-col.wk{border-left:1px dashed var(--line);margin-left:-3px;padding-left:2px}
.load-bar{width:100%;max-width:18px;height:72px;display:flex;align-items:flex-end}
.load-bar i{display:block;width:100%;border-radius:4px 4px 2px 2px;background:var(--accent)}
.load-bar i.hi{background:var(--danger)}
.load-bar i.zero{height:2px!important;background:var(--line-strong);border-radius:1px}
.load-d{font-size:11px;line-height:1.15;color:var(--ink-2);text-align:center;font-variant-numeric:tabular-nums}
.load-d b{display:block;font-weight:500}
.load-col.today .load-d{color:var(--accent-ink);font-weight:700}
.load-col.today .load-d b{font-weight:700}
.load-key{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12px;color:var(--ink-2)}
.load-key span{display:inline-flex;align-items:center;gap:6px}
.load-key i{width:10px;height:10px;border-radius:3px;background:var(--accent)}
.load-key i.hi{background:var(--danger)}
.load-peak{margin:10px 0 0;font-size:13px;color:var(--ink-2)}
.load-peak b{color:var(--ink);font-weight:600}
.rp-item{padding:10px 0;border-top:1px solid var(--line)}
.rp-item:first-of-type{border-top:0;padding-top:2px}
.rp-head{display:flex;align-items:flex-start;gap:10px}
.rp-head .res-t{flex:1;min-width:0}
.rp-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rp{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:var(--r-pill);border:1.5px solid var(--line-strong);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink-2)}
.rp svg{width:16px;height:16px}
.rp .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-strong);flex:none}
.rp[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.rp.today{border-color:var(--accent);color:var(--ink)}
.rp.today[aria-pressed="true"]{color:var(--on-accent)}
.rp:disabled{opacity:.6}

.cls-list{display:flex;flex-direction:column;gap:6px}
.cls{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:var(--r-md);border:1.5px solid transparent}
.cls-h{display:flex;flex-direction:column;align-items:flex-end;min-width:48px;font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink-2)}
.cls-h b{font-size:15px;font-weight:600;color:var(--ink)}
.cls.now{border-color:var(--accent);background:var(--accent-soft)}
.cls.next{border-color:var(--line-strong)}
.cls.done .res-t b,.cls.done .cls-h b{color:var(--muted)}
.cls-tag{display:inline-block!important;margin-top:4px;font-size:12px!important;font-weight:600;color:var(--accent-ink)!important}
.cls.next .cls-tag{color:var(--ink-2)!important}

/* Clipboard */
.clip{position:relative;border-radius:var(--r-lg);border:1.5px dashed var(--line-strong);background:var(--surface);padding:16px}
.clip-text{font-family:var(--f-mono);font-size:14px;line-height:1.55;color:var(--ink);white-space:pre-wrap;word-break:break-word;margin:0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.clip-empty{color:var(--muted);font-size:15px;margin:0}
.clip-acts{display:flex;gap:8px;margin-top:14px;align-items:center;flex-wrap:wrap}
.clip-when{margin-left:auto;font-size:13px;color:var(--muted)}

/* Folders row */
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:4px;margin:0 calc(-1 * max(18px,env(safe-area-inset-left,0px)));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.ftile{flex:none;width:136px;min-height:112px;scroll-snap-align:start;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--fc,var(--c8));padding:14px 14px 12px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.ftile b{font-size:15px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ftile span{font-size:13px;color:var(--muted)}
.ftile.add{border:1.5px dashed var(--line-strong);border-top-width:1.5px;align-items:flex-start;color:var(--ink-2)}
.ftile.add svg{width:24px;height:24px;color:var(--accent-ink)}

/* Lists */
.list{display:flex;flex-direction:column;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 6px 8px 14px;text-align:left;width:100%;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row:active{background:var(--surface-2)}
.row-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--fc,var(--ink-2));flex:none}
.row-ic svg{width:20px;height:20px}
.row-t{flex:1;min-width:0}
.row-t b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-t span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-w{font-size:13px;color:var(--muted);white-space:nowrap;padding-right:6px}
.row .icon-btn{color:var(--ink-2)}
.chev{color:var(--muted);margin-right:8px}
.empty{text-align:center;padding:36px 20px;border-radius:var(--r-lg);border:1.5px dashed var(--line-strong)}
.empty h3{font-family:var(--f-display);font-size:20px;margin:6px 0}
.empty p{color:var(--muted);margin:0 auto 16px;max-width:36ch}
.empty .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.bottom-space{height:28px}

/* ---------- Editor ---------- */
.ed-top{display:flex;align-items:center;gap:4px;min-height:56px;padding-top:4px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.ed-back{display:flex;align-items:center;gap:2px;min-height:44px;padding:0 10px 0 4px;border-radius:var(--r-pill);color:var(--accent-ink);font-weight:600;font-size:16px;min-width:0;max-width:60%}
.ed-back span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-back svg{width:24px;height:24px}
.ed-top .sp{flex:1}
.ed-head{padding-top:14px;padding-bottom:6px}
.ed-title{width:100%;border:0;background:transparent;font-family:var(--f-display);font-weight:700;font-size:27px;line-height:1.2;padding:2px 0;color:var(--ink)}
.ed-title:focus{outline:none}
.ed-title::placeholder{color:var(--muted)}
.ed-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:var(--r-pill);background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);font-weight:600;font-size:12px}
.save-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.save-dot.busy{background:var(--warn)}.save-dot.err{background:var(--danger)}
.ed-body{flex:1;min-height:0;display:flex;flex-direction:column}
.ed-tools{flex:none;display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none;padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));background:var(--surface);border-top:1px solid var(--line)}
.ed-tools::-webkit-scrollbar{display:none}
.dict-bar{flex:none;position:relative;z-index:6;display:flex;align-items:center;gap:10px;min-height:56px;padding:6px max(12px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));font-size:14px;color:var(--ink);background:var(--accent-soft);border-top:1px solid var(--line)}
.dict-bar:not([hidden]){padding-bottom:28px}
.app.in-editor .dict-bar:not([hidden]){padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
.dict-dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--danger);animation:pulse 1.4s ease-in-out infinite}
.dict-t{flex:1;min-width:0;display:flex;flex-direction:column}
.dict-t b,.dict-t span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dict-t span{color:var(--ink-2);font-size:13px}
.dict-bar .link{flex:none;min-height:44px;padding:0 6px}
.dict-stop{flex:none;min-height:44px;padding:0 14px}
.dict-bar[hidden]{display:none}
.tb.on[aria-label="Dictar por voz"],.tb[aria-pressed="true"][aria-label="Dictar por voz"]{background:var(--danger);color:var(--bg)}
.tb{flex:none;min-width:44px;height:44px;padding:0 8px;border-radius:12px;display:inline-grid;place-items:center;color:var(--ink);font-size:16px;font-weight:700}
.tb svg{width:22px;height:22px}
.tb:active,.tb.on{background:var(--accent-soft);color:var(--accent-ink)}
.tb.txt{font-size:14px;font-weight:600;padding:0 12px}
.tsep{flex:none;width:1px;height:26px;background:var(--line-strong);margin:0 4px;opacity:.6}
.tb select{min-height:40px;border-radius:10px;background:var(--surface-2);border:1.5px solid var(--line-strong);padding:0 10px;font-size:14px;font-weight:600}

.prose{font-size:17px;line-height:1.65;color:var(--ink);max-width:70ch;width:100%;margin:0 auto}
.prose h1{font-family:var(--f-display);font-size:28px;line-height:1.25;margin:.7em 0 .3em;text-wrap:balance}
.prose h2{font-family:var(--f-display);font-size:22px;line-height:1.3;margin:.9em 0 .3em;text-wrap:balance}
.prose h3{font-size:18px;margin:.9em 0 .3em}
.prose p{margin:.45em 0}
.prose a{color:var(--accent-ink);text-underline-offset:3px}
.prose blockquote{margin:.8em 0;padding:.3em 1em;border-left:4px solid var(--accent);color:var(--ink-2);background:var(--surface);border-radius:0 10px 10px 0}
.prose code{font-family:var(--f-mono);font-size:.86em;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:.08em .38em}
.prose pre{font-family:var(--f-mono);font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;overflow-x:auto;line-height:1.55}
.prose pre code{background:none;border:0;padding:0;font-size:inherit}
.prose table{border-collapse:collapse;display:block;overflow-x:auto;max-width:100%}
.prose th,.prose td{border:1px solid var(--line-strong);padding:7px 10px;text-align:left}
.prose th{background:var(--surface-2)}
.prose hr{border:0;border-top:2px dashed var(--line-strong);margin:1.4em 0}
.prose img{max-width:100%;border-radius:10px}
.prose ul,.prose ol{padding-left:1.4em}
.prose ul[data-check]{list-style:none;padding-left:2px}
.prose ul[data-check] li{position:relative;padding-left:34px;margin:6px 0;min-height:26px}
.prose ul[data-check] li::before{content:"";position:absolute;left:0;top:.18em;width:22px;height:22px;border:2px solid var(--line-strong);border-radius:7px;cursor:pointer;background:var(--surface)}
.prose ul[data-check] li[data-checked="true"]{color:var(--muted);text-decoration:line-through}
.prose ul[data-check] li[data-checked="true"]::before{background:var(--accent);border-color:var(--accent)}
.prose ul[data-check] li[data-checked="true"]::after{content:"";position:absolute;left:7px;top:calc(.18em + 3px);width:6px;height:11px;border:solid var(--on-accent);border-width:0 3px 3px 0;transform:rotate(45deg)}
.rich{flex:1;overflow-y:auto;outline:none;padding-top:8px;padding-bottom:48px}
.rich:empty::before{content:attr(data-ph);color:var(--muted)}
.md-wrap{flex:1;min-height:0;display:grid;grid-template-columns:1fr}
.md-wrap.split{grid-template-columns:1fr 1fr}
.md-src{border:0;background:transparent;resize:none;outline:none;padding-top:10px;padding-bottom:40px;font-family:var(--f-mono);font-size:15px;line-height:1.65;min-height:0;min-width:0;tab-size:4;color:var(--ink)}
.md-prev{overflow-y:auto;padding-top:10px;padding-bottom:40px;min-width:0}
.md-wrap.split .md-src{border-right:1px solid var(--line)}
.md-wrap:not(.split) .md-src.hide,.md-wrap:not(.split) .md-prev.hide{display:none}
.code-wrap{flex:1;position:relative;min-height:0;margin:0 max(10px,env(safe-area-inset-left,0px)) 10px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.code-wrap pre,.code-wrap textarea{position:absolute;inset:0;margin:0;padding:14px 14px 48px;font-family:var(--f-mono);font-size:14px;line-height:1.6;tab-size:4;white-space:pre;overflow:auto;border:0;letter-spacing:0;word-spacing:0;border-radius:12px}
.code-wrap.wrapl pre,.code-wrap.wrapl textarea{white-space:pre-wrap;word-break:break-word}
.code-wrap pre{pointer-events:none;color:var(--ink)}
.code-wrap textarea{background:transparent;color:transparent;caret-color:var(--accent);resize:none;outline:none}
.code-wrap textarea::selection{background:var(--accent-soft);color:transparent}
.hljs-keyword,.hljs-selector-tag,.hljs-literal,.hljs-doctag{color:var(--sx-k)}
.hljs-string,.hljs-regexp,.hljs-template-string,.hljs-selector-attr{color:var(--sx-s)}
.hljs-number,.hljs-symbol,.hljs-bullet{color:var(--sx-n)}
.hljs-comment,.hljs-quote,.hljs-meta{color:var(--sx-c);font-style:italic}
.hljs-title,.hljs-title.function_,.hljs-section{color:var(--sx-f)}
.hljs-type,.hljs-built_in,.hljs-title.class_{color:var(--sx-t)}
.hljs-attr,.hljs-attribute,.hljs-variable,.hljs-template-variable,.hljs-name,.hljs-tag,.hljs-property,.hljs-params{color:var(--sx-a)}

/* ---------- Sheets ---------- */
.sheet-scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .16s ease}
.sheet{width:100%;max-width:560px;max-height:88dvh;display:flex;flex-direction:column;background:var(--surface);border-radius:24px 24px 0 0;border:1px solid var(--line);border-bottom:0;box-shadow:var(--shadow);animation:up .22s cubic-bezier(.2,.8,.2,1)}
.sheet-h{display:flex;align-items:center;gap:8px;padding:14px 10px 6px 20px}
.sheet-h h3{flex:1;margin:0;font-family:var(--f-display);font-size:21px;font-weight:600;line-height:1.25}
.sheet-b{overflow-y:auto;padding:8px 20px 12px;overscroll-behavior:contain}
.sheet-b > p{color:var(--ink-2);margin:0 0 14px}
.sheet-f{display:flex;gap:10px;padding:10px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.sheet-f .btn{flex:1}
.acts-list{display:flex;flex-direction:column;margin:0 -8px}
.act{display:flex;align-items:center;gap:14px;min-height:54px;padding:0 12px;border-radius:var(--r-md);text-align:left;font-size:16px;font-weight:500;width:100%}
.act:active,.act:hover{background:var(--surface-2)}
.act svg{width:22px;height:22px;color:var(--ink-2)}
.act.danger,.act.danger svg{color:var(--danger)}
.act-sep{height:1px;background:var(--line);margin:6px 12px}
.fmts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fmt{border:1.5px solid var(--line-strong);border-radius:var(--r-md);padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px;font-weight:600;background:var(--surface-2);text-align:center}
.fmt svg{width:24px;height:24px}
.fmt small{font-size:12px;color:var(--muted);font-weight:500}
.fmt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:2px solid transparent;font-size:13px;font-weight:700;color:var(--ink-2)}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px var(--surface) inset}
.sw.none{border:2px dashed var(--line-strong)}
.modes{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.mode-opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line-strong);border-radius:var(--r-md);padding:12px 14px;background:var(--surface-2)}
.mode-opt b{display:block;font-size:16px}
.mode-opt small{display:block;color:var(--muted);font-size:13px;line-height:1.4}
.mode-opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.mdot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:7px;display:inline-block}
.m-private{background:var(--ok)}.m-read{background:var(--warn)}.m-open{background:var(--danger)}
.form-err{color:var(--danger);font-size:14px;min-height:1.2em;font-weight:500}
.hist{display:flex;flex-direction:column;gap:8px}
.hist button{text-align:left;padding:12px 14px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line);font-family:var(--f-mono);font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word;max-height:7.5em;overflow:hidden}
.hist small{display:block;font-family:var(--f-body);color:var(--muted);margin-top:4px}

/* ---------- Settings ---------- */
.set-group{border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);overflow:hidden}
.set-row{display:flex;align-items:center;gap:14px;min-height:60px;padding:10px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.set-row:last-child{border-bottom:0}
.set-row > svg{width:22px;height:22px;color:var(--ink-2)}
.set-row .row-t b{font-weight:600}
.set-row.danger,.set-row.danger > svg{color:var(--danger)}
.pal-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px;width:100%;margin-top:4px}
.pal{border:1.5px solid var(--line-strong);border-radius:var(--r-md);padding:10px;display:flex;align-items:center;gap:10px;background:var(--surface-2);font-weight:600;font-size:15px;text-align:left;min-height:56px}
.pal[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.pal i{width:34px;height:34px;border-radius:10px;flex:none;position:relative;border:1px solid rgba(127,127,127,.35)}
.pal i::after{content:"";position:absolute;right:-4px;bottom:-4px;width:16px;height:16px;border-radius:50%;background:var(--pa);border:2px solid var(--surface-2)}
.acc-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;width:100%;margin-top:4px}
.acc-row input[type=color]{width:44px;height:44px;border:1.5px solid var(--line-strong);border-radius:50%;padding:0;background:none;cursor:pointer;overflow:hidden}
.acc-row input[type=color]::-webkit-color-swatch-wrapper{padding:0}.acc-row input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
.set-col{flex-direction:column;align-items:stretch}
.set-col .row-t span{white-space:normal}
.set-label{font-size:14px;font-weight:600;color:var(--muted);margin:22px 4px 8px}

/* ---------- AI models ---------- */
.ai-lead{color:var(--ink-2);margin:0 0 4px;font-size:15px}
.ai .row-t span{white-space:normal}
.ai-model{font-family:var(--f-mono);font-size:13px;word-break:break-all}
.ai .row-t b.ai-model{white-space:normal;font-size:14px}
.ai-box{border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);padding:16px 16px 2px}
.ai-box .hint{display:block;margin-top:2px}
.ai-box .form-err{min-height:0}
.ai-box .textarea{min-height:104px}
.ai-params{display:grid;grid-template-columns:1fr;gap:0 14px}
.set-row .icon-btn{margin-right:-8px}
.ai-fav-ic{color:var(--accent-ink)}
.ai-test-row{display:flex;gap:10px;align-items:stretch;margin-bottom:14px}
.ai-test-row .input{flex:1;min-width:0}
.ai-out{margin:0 0 14px;border-radius:var(--r-md);padding:12px 14px;border:1.5px solid var(--line-strong);background:var(--surface-2);font-size:15px}
.ai-out.ok{border-color:var(--ok)}
.ai-out.err{border-color:var(--danger);background:var(--danger-soft)}
.ai-out b{display:block;font-weight:600}
.ai-out p{margin:6px 0 0;color:var(--ink-2);font-size:14px;word-break:break-word}
.ai-text{margin-top:8px;white-space:pre-wrap;word-break:break-word;max-height:240px;overflow:auto;color:var(--ink)}
.ai-bar{position:sticky;bottom:0;z-index:2;display:flex;align-items:center;gap:12px;margin-top:22px;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.ai-bar span{flex:1;font-size:14px;color:var(--ink-2);font-weight:500}
.ai-bar span.warn{color:var(--ink)}
.ai-bar span.warn::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-right:8px;vertical-align:1px}
.ai-pick-head{position:sticky;top:-8px;z-index:1;background:var(--surface);padding:6px 0 8px;margin-top:-6px}
.ai-pick-head .search-field{margin-top:10px;background:var(--surface-2)}
.ai-seg{display:flex}
.ai-seg button{flex:1}
.ai-info{margin:2px 2px 4px}
.ai-list{display:flex;flex-direction:column;margin:0 -8px}
.ai-sub{font-size:13px;font-weight:600;color:var(--muted);margin:12px 12px 2px}
.ai-opt{display:flex;align-items:center;gap:2px}
.ai-opt-b{flex:1;min-width:0;min-height:48px;display:flex;align-items:center;gap:10px;padding:6px 12px;text-align:left;font-family:var(--f-mono);font-size:14px;word-break:break-all;border-radius:var(--r-md)}
.ai-opt-b:hover{background:var(--surface-2)}
.ai-opt-b[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.ai-opt-b small{margin-left:auto;font-family:var(--f-body);font-size:12px;font-weight:600;flex:none}
.ai-star{color:var(--muted)}
.ai-star[aria-pressed="true"]{color:var(--accent-ink)}
@media (min-width:600px){ .ai-params{grid-template-columns:repeat(3,1fr)} }

/* ---------- Assistant ---------- */
.as-ex{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.as-ex span,.as-ex button{align-self:flex-start;max-width:90%;padding:10px 14px;border-radius:18px 18px 18px 6px;background:var(--surface);border:1px solid var(--line-strong);font-size:15px;text-align:left;min-height:44px}
.as-ex button:hover{background:var(--surface-2)}
.chat-log{display:flex;flex-direction:column;gap:12px;padding-top:6px;padding-bottom:16px}
.chat-day{align-self:center;font-size:13px;font-weight:600;color:var(--muted);margin-top:6px}
.msg{max-width:min(88%,620px);font-size:16px;line-height:1.5;word-break:break-word}
.msg.yo{align-self:flex-end;background:var(--accent-soft);border:1px solid var(--line-strong);padding:10px 14px;border-radius:18px 18px 6px 18px;white-space:pre-wrap}
.msg.ia{align-self:flex-start;width:min(88%,620px)}
.msg.ia > .txt{background:var(--surface);border:1px solid var(--line);padding:10px 14px;border-radius:18px 18px 18px 6px;white-space:pre-wrap}
.msg.err > .txt{background:var(--danger-soft);border-color:var(--danger)}
.msg.ia > .txt[role="button"]{cursor:pointer}
.msg.ia > .txt[aria-expanded="true"]{border-color:var(--line-strong)}
.msg.ia > .txt.md{white-space:normal}
.txt.md > :first-child{margin-top:0}
.txt.md > :last-child{margin-bottom:0}
.txt.md p{margin:.5em 0}
.txt.md ul,.txt.md ol{margin:.4em 0;padding-left:1.3em}
.txt.md li{margin:.15em 0}
.txt.md h1,.txt.md h2,.txt.md h3,.txt.md h4{font-size:1em;font-weight:700;margin:.8em 0 .3em}
.txt.md a{color:var(--accent-ink);text-underline-offset:3px}
.txt.md code{font-family:var(--f-mono);font-size:.88em;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:.05em .35em}
.txt.md pre{font-family:var(--f-mono);font-size:14px;line-height:1.5;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto;margin:.5em 0}
.txt.md pre code{background:none;border:0;padding:0;font-size:inherit}
.txt.md table{border-collapse:collapse;display:block;overflow-x:auto;max-width:100%;font-size:.94em;margin:.5em 0}
.txt.md th,.txt.md td{border:1px solid var(--line-strong);padding:5px 8px;text-align:left}
.txt.md th{background:var(--surface-2)}
.txt.md blockquote{margin:.5em 0;padding-left:.8em;border-left:3px solid var(--line-strong);color:var(--ink-2)}
.txt.md hr{border:0;border-top:1px solid var(--line-strong);margin:.8em 0}
.msg-acts{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px}
button.msg.yo{font:inherit;color:var(--ink);text-align:left;cursor:pointer}
button.msg.yo[aria-expanded="true"]{border-color:var(--accent-ink)}
.msg-yo-w{align-self:flex-end;display:flex;flex-direction:column;align-items:flex-end;max-width:min(88%,620px)}
.msg-yo-w .msg.yo{max-width:100%}
.yo-acts{justify-content:flex-end;gap:2px}
.msg-acts{gap:2px}

.conv{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;overflow:hidden;color-scheme:dark;

function addDays(f, n) { const d = new Date(f + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function hoyLoadChart(pend, hoy) {
  const days = Array.from({length:14}, (_, i) => { const f = addDays(hoy, i); const ts = pend.filter(t => t.fecha === f);
    return { f, ts, w: ts.reduce((s, t) => s + (HOY_PESO[t.tipo] || 1), 0) }; });
  const max = Math.max(HOY_ALTO + 1, ...days.map(x => x.w));

  const busy = days.filter(x => x.w).length;
  const label = busy ? days.filter(x => x.w).map(x => `${fmtDay(x.f,{weekday:'long',day:'numeric'})}: ${x.ts.map(t => t.titulo).join(', ')}`).join('; ') : 'Sin entregas en las próximas dos semanas';

  const peaks = days.filter(x => x.w).sort((a,b) => b.w - a.w || a.f.localeCompare(b.f)).slice(0, 2);

const CHAT = { loaded:false, loading:false, err:null, msgs:[], more:false, estado:null, config:null, sending:false, failed:null, draft:'', olderLoading:false,
  chats:[], chatId:null, temporal:false, tmsgs:[] };
const CHAT_EXAMPLES = ['¿qué clase me toca ahora?','prueba de big data el martes 2','entregar deber de compiladores el viernes','las pruebas de fundamentos son de opción múltiple','¿qué tengo esta semana?'];

const localDay = (d=new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const daysUntil = f => Math.round((Date.parse(f + 'T12:00:00Z') - Date.parse(localDay() + 'T12:00:00Z')) / 86400000);
const fmtDay = (f, opts={weekday:'short',day:'numeric',month:'short'}) => new Date(f + 'T12:00:00').toLocaleDateString('es', opts);
const fmtDue = (f, hora) => f ? fmtDay(f) + (hora ? ', ' + hora : '') : 'Sin fecha';
const shortModel = m => String(m || '').split('/').pop();
const chatMsgs = () => CHAT.temporal ? CHAT.tmsgs : CHAT.msgs;
const chatActual = () => CHAT.chats.find(c => c.id === CHAT.chatId) || null;

async function chatLoad() {
  if (CHAT.loading) return; CHAT.loading = true; CHAT.err = null;
  const [est, cfg, lst] = await Promise.allSettled([api('/asistente/estado'), api('/config/ia'), api('/asistente/chats')]);
  CHAT.estado = est.status === 'fulfilled' ? est.value : null;
  CHAT.config = cfg.status === 'fulfilled' ? cfg.value.config : null;
  if (lst.status === 'fulfilled') {
    CHAT.chats = lst.value.chats;
    const guardado = Number(pref('bitacora.chatActual', 0));
    CHAT.chatId = CHAT.chats.some(c => c.id === guardado) ? guardado : (CHAT.chats[0]?.id ?? null);
    try { await chatFetch(); } catch (e) { CHAT.err = e.message; }
  } else if (CHAT.estado && !CHAT.estado.historial) { CHAT.chats = []; CHAT.msgs = []; }
  else CHAT.err = lst.reason?.message || 'No se pudo cargar el chat.';
  if (!CHAT.err) CHAT.loaded = true;
  CHAT.loading = false; chatPaint(true);
}
async function chatFetch() {
  CHAT.msgs = []; CHAT.more = false; CHAT.failed = null;
  if (!CHAT.chatId) return;
  const r = await api(`/asistente/historial?limite=50&chat=${CHAT.chatId}`);
  CHAT.msgs = r.mensajes; CHAT.more = CHAT.msgs.length >= 50;
}
async function chatOpen(id) {
  CHAT.temporal = false; CHAT.tmsgs = []; CHAT.chatId = id; setPref('bitacora.chatActual', id || null);
  CHAT.msgs = []; chatPaint();

  chatPaint(true);
}

async function chatSend(text, opts = {}) {

    const modelo = chatModelo();

    if (temporal) Object.assign(body, { temporal:true, historial: CHAT.tmsgs.slice(-8).map(m => ({ rol:m.rol, texto:m.texto, datos:m.datos })) });
    else if (CHAT.chatId) body.chat = CHAT.chatId;

      const c = { ...(CHAT.chats.find(x => x.id === r.chat.id) || { id:r.chat.id, titulo:r.chat.titulo, mensajes:0 }), actualizado: r.asistente.creado };
      c.mensajes = (c.mensajes || 0) + 2;
      CHAT.chats = [c, ...CHAT.chats.filter(x => x.id !== c.id)];

// Voice dictation (Web Speech API). One global session that survives navigation inside Bitácora:
// it keeps writing into the chat draft or the note where it started until the person taps the mic again.
// Android Chrome repeats phrases in continuous mode, so there each phrase is its own short session that
// restarts on its own; the gaps are a fraction of a second.
var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

const dictSame = (a, b) => !!a && !!b && a.kind === b.kind && a.id === b.id;
const dictActive = target => DICT.on && dictSame(DICT.target, target);
function dictJoin(prev, t) { prev = prev || ''; return prev + (prev && !/\s$/.test(prev) ? ' ' : '') + t; }

function dictToggleTarget(target) {
  if (!SpeechRec) return;
  if (dictActive(target)) { dictEnd(); return; }
  if (DICT.on) { dictFlush(); DICT.target = target; DICT.interim = ''; dictUi(); return; }
  DICT.on = true; DICT.target = target; DICT.errors = 0; DICT.interim = ''; DICT.lastFinal = '';
  dictSession(); dictUi();
}
function dictEnd() {
  if (!DICT.on) return;
  DICT.on = false; const rec = DICT.rec; DICT.rec = null;
  try { rec?.stop(); } catch {}
  dictFlush(); DICT.interim = ''; DICT.target = null; dictUi();
}
function dictSession() {
  if (!DICT.on || DICT.rec || document.hidden) return;
  const rec = new SpeechRec(); rec.lang = 'es-EC'; rec.interimResults = true; rec.continuous = !DICT_ANDROID;
  let emitted = ''; // text already written in this session (guards against repeated results)
  rec.onresult = ev => {
    let finals = '', interim = '';
    for (let i = 0; i < ev.results.length; i++) { const t = ev.results[i][0].transcript.trim(); if (!t) continue;
      if (ev.results[i].isFinal) finals = dictJoin(finals, t); else interim = dictJoin(interim, t); }
    // Some engines resend everything heard so far; write only what is new.
    let nuevo = finals.startsWith(emitted) ? finals.slice(emitted.length).trim() : finals;
    if (nuevo && !(nuevo === DICT.lastFinal && Date.now() - DICT.lastAt < 2000)) { dictEmit(nuevo); DICT.lastFinal = nuevo; DICT.lastAt = Date.now(); }
    emitted = finals; DICT.interim = interim; DICT.errors = 0; armIdle(); dictUi();
  };
  rec.onerror = ev => {
    if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') { toast('Permite el micrófono para dictar'); DICT.rec = null; dictEnd(); return; }
    if (ev.error !== 'aborted' && ev.error !== 'no-speech') DICT.errors++;
    if (DICT.errors >= 5) { toast('El dictado se detuvo: ' + ev.error); DICT.rec = null; dictEnd(); }
  };
  rec.onend = () => { if (DICT.rec !== rec) return; DICT.rec = null; DICT.interim = ''; dictUi();
    if (DICT.on) setTimeout(dictSession, DICT.errors ? 800 : 120); };
  try { rec.start(); DICT.rec = rec; } catch { DICT.rec = null; if (DICT.on) setTimeout(dictSession, 800); }
}
// Chrome stops listening when the page is hidden; it resumes on return while still on.
document.addEventListener('visibilitychange', () => { if (!document.hidden && DICT.on) dictSession(); });

// Writes a finished phrase where the dictation started.
function dictEmit(t) {
  const tg = DICT.target; if (!tg) return;
  if (tg.kind === 'chat') {
    CHAT.draft = dictJoin(CHAT.draft, t);
    const ta = S.view === 'assistant' ? $('#chatIn') : null;
    if (ta) { ta.value = CHAT.draft; ta.dispatchEvent(new Event('input')); ta.scrollTop = ta.scrollHeight; }
    return;
  }
  if (S.view === 'editor' && S.fileId === tg.id && ed?.dictar) { ed.dictar(t); return; }
  DICT.pending = dictJoin(DICT.pending, t);
  clearTimeout(DICT.flushT); DICT.flushT = setTimeout(dictFlush, 4000);

// Saves phrases dictated while the note is closed (appended at the end).
function dictFlush() {
  clearTimeout(DICT.flushT); const tg = DICT.target; const txt = DICT.pending.trim(); DICT.pending = '';
  if (!txt || tg?.kind !== 'note') return;
  const it = get(tg.id); if (!it || !S.canWrite) return;
  const esc = txt.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const content = it.format === 'rich' ? (it.content || '') + `<p>${esc}</p>` : dictJoin(it.content || '', txt);
  Store.patch(tg.id, { content, updated: Date.now() });
}
// Inserter for the open editor: each phrase goes where the cursor was.
function dictInserter(target) {
  let range = null;
  const keep = () => { const s = getSelection(); if (s.rangeCount && target.contains(s.anchorNode)) range = s.getRangeAt(0).cloneRange(); };
  document.addEventListener('selectionchange', () => { if (target.isConnected) keep(); });
  return t => {
    if (!target.isConnected) return;
    if (document.activeElement !== target) { target.focus({ preventScroll:true }); if (range && target.isContentEditable) { const s = getSelection(); s.removeAllRanges(); s.addRange(range); } }
    let txt = t.trim(); if (!txt) return;
    if (target.tagName === 'TEXTAREA') { const prev = target.value.slice(0, target.selectionStart); if (prev && !/\s$/.test(prev)) txt = ' ' + txt; }
    else { const r = getSelection().rangeCount ? getSelection().getRangeAt(0) : null;
      if (r && r.startContainer.nodeType === 3 && r.startOffset > 0 && !/[\s\u00a0]/.test(r.startContainer.data[r.startOffset - 1])) txt = ' ' + txt; }
    if (!document.execCommand('insertText', false, txt + ' ') && target.tagName === 'TEXTAREA') { target.setRangeText(txt + ' ', target.selectionStart, target.selectionEnd, 'end'); target.dispatchEvent(new Event('input')); }

/* ---------- Voice output: read replies aloud (system voice or Gemini) ---------- */
const VOZ_DEF = { motor:'sistema', sysVoice:'', rate:1, pitch:1, gem:'Kore' };
const GEM_VOCES = [['Kore','Firme'],['Puck','Animada'],['Charon','Informativa'],['Aoede','Ligera'],['Leda','Juvenil'],['Orus','Firme'],['Zephyr','Brillante'],
  ['Fenrir','Entusiasta'],['Callirrhoe','Relajada'],['Autonoe','Brillante'],['Enceladus','Suave, con aire'],['Iapetus','Clara'],['Umbriel','Relajada'],
  ['Algieba','Fluida'],['Despina','Fluida'],['Erinome','Clara'],['Algenib','Grave'],['Rasalgethi','Informativa'],['Laomedeia','Alegre'],['Achernar','Suave'],
  ['Alnilam','Firme'],['Schedar','Pareja'],['Gacrux','Madura'],['Pulcherrima','Directa'],['Achird','Amigable'],['Zubenelgenubi','Casual'],
  ['Vindemiatrix','Amable'],['Sadachbia','Viva'],['Sadaltager','Experta'],['Sulafat','Cálida']];
function vozCfg() { try { return { ...VOZ_DEF, ...JSON.parse(pref('bitacora.voz', '{}')) }; } catch { return { ...VOZ_DEF }; } }
function setVozCfg(part) { setPref('bitacora.voz', JSON.stringify({ ...vozCfg(), ...part })); }
const TTS = window.speechSynthesis || null;
const sysVoices = () => (TTS?.getVoices() || []).filter(v => /^es\b|^es-/i.test(v.lang)).sort((a, b) => (b.localService - a.localService) || a.lang.localeCompare(b.lang) || a.name.localeCompare(b.name));
var VOZ = { cur:null, msg:null, word:-1, cache:new Map(), warned:false, onVoices:null };
TTS?.addEventListener?.('voiceschanged', () => VOZ.onVoices?.());
// Words with their position in the text, for highlighting.
function vozWords(text) { const out = []; const re = /\S+/g; let m; while ((m = re.exec(text))) out.push({ i:m.index, end:m.index + m[0].length }); return out; }
const wordAt = (words, pos) => { let k = -1; for (let j = 0; j < words.length && words[j].i <= pos; j++) k = j; return k; };
const speakable = t => t.replace(/[*_#`>|~]/g, ' ');
function vozStop() { const c = VOZ.cur; if (c) c.stop(); }

// Reads text aloud; on.word(index) as it goes and on.end(reason) at the end ('end', 'stop' or 'error').
function vozSpeak(text, on = {}) {
  vozStop();
  const words = vozWords(text); const cfg = vozCfg();
  const job = { done:false, stopped:false, cancel:null };
  const finish = reason => { if (job.done) return; job.done = true; if (VOZ.cur === job) VOZ.cur = null; on.end?.(reason); };
  job.stop = () => { job.stopped = true; try { job.cancel?.(); } catch {} finish('stop'); };
  job.word = i => { if (job.done || i === job.ultima) return; job.ultima = i; on.word?.(i); };
  VOZ.cur = job;
  (async () => {
    if (cfg.motor === 'gemini' && S.isOwner) {
      try { await vozGemini(text, words, cfg, job, finish); return; }
      catch (e) { if (job.stopped) return; if (!VOZ.warned) { VOZ.warned = true; toast(e.message + '. Uso la voz del sistema.'); } }
    }
    vozSystem(text, words, cfg, job, finish);
  })();
  return job;
}
// System voice: sentences one after another (Chrome cuts very long utterances); word boundaries give the highlight.
function vozSystem(text, words, cfg, job, finish, desde = 0) {
  if (!TTS) { toast('Este navegador no puede leer en voz alta'); finish('error'); return; }
  TTS.cancel(); job.cancel = () => TTS.cancel();
  const voice = sysVoices().find(v => v.voiceURI === cfg.sysVoice) || sysVoices()[0] || null;
  const chunks = []; const re = /[^.!?;:\n]+[.!?;:\n]*\s*/g; let m; const resto = text.slice(desde); // `desde`: continúa donde quedó otra voz
  while ((m = re.exec(resto))) if (m[0].trim()) chunks.push({ t:m[0], at:desde + m.index });
  if (!chunks.length) { finish('end'); return; }

// Message tools: copy, regenerate, edit and delete (like Claude or Gemini).
const chatList = () => CHAT.temporal ? CHAT.tmsgs : CHAT.msgs;
const undoable = d => !!d && !d.deshecho && (d.resultados || []).some(r => r.ok && r.deshacer);
// Turn of a message: the user message and everything after it (it is replaced when regenerating or editing).
function chatTurnFrom(m) {
  const list = chatList(); let i = list.indexOf(m);
  if (i < 0) return null;
  if (m.rol !== 'usuario') { while (i >= 0 && list[i].rol !== 'usuario') i--; if (i < 0) return null; }
  return { user: list[i], index: i, after: list.slice(i) };
}
// Undoes what the replaced replies created in Notion and removes them, after confirming when it matters.
async function chatRedo(m, newText) {
  if (CHAT.sending) return;
  const t = chatTurnFrom(m); if (!t) return;
  const texto = (newText ?? t.user.texto).trim(); if (!texto) return;
  const persisted = !CHAT.temporal && typeof t.user.id === 'number';
  let info;
  try { info = persisted ? await api('/asistente/recortar', { method:'POST', body:{ id:t.user.id, simular:true } })
    : { cambios: t.after.filter(x => undoable(x.datos)).reduce((n, x) => n + x.datos.resultados.filter(r => r.ok && r.deshacer).length, 0),
        posteriores: t.after.filter(x => x.rol === 'usuario').length - 1 }; }
  catch (e) { toast(e.message); return; }
  const run = async () => {
    try {
      if (persisted) await api('/asistente/recortar', { method:'POST', body:{ id:t.user.id } });
      else for (const x of [...t.after].reverse()) if (undoable(x.datos)) await api('/asistente/deshacer', { method:'POST', body:{ datos:x.datos } });
    } catch (e) { toast(e.message); return false; }
    chatList().splice(t.index); CHAT.editing = null; CHAT.draft = ''; CHAT.selUser = null;
    chatSend(texto); return true;
  };
  if (!info.cambios && !info.posteriores) { await run(); return; }
  const lines = [];
  if (info.cambios) lines.push(`Se deshará en Notion lo que creó esta respuesta (${info.cambios} ${info.cambios === 1 ? 'cambio' : 'cambios'}).`);
  if (info.posteriores > 0) lines.push(info.posteriores === 1 ? 'Se borrará el mensaje posterior de esta conversación.' : `Se borrarán los ${info.posteriores} mensajes posteriores de esta conversación.`);
  openSheet({ title: newText != null ? 'Editar mensaje' : 'Regenerar respuesta', body: lines.map(l => h('p',{class:'sheet-p',text:l})),
    confirm: newText != null ? 'Enviar' : 'Regenerar', onConfirm: run });
}

function chatDelete(m) {

// Las respuestas de Kell pueden traer Markdown (negritas, viñetas, tablas): se dibuja saneado; el texto simple queda tal cual.
function chatMd(src, el) {
  src = String(src || '');
  if (!/[*_`#|~]|\[[^\]]+\]\(|^\s*(?:[-+>]|\d+[.)])\s/m.test(src)) { el.textContent = src; return; }
  try {
    el.innerHTML = DOMPurify.sanitize(marked.parse(src, {gfm:true, breaks:true}), {FORBID_TAGS:['img','style','form','input','button','iframe','video','audio','svg']});
    el.classList.add('md');
    el.querySelectorAll('a').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
  } catch { el.classList.remove('md'); el.textContent = src; }
}

/* ---------- AI models (Ajustes → Modelos de IA) ---------- */
// Keys live in Cloudflare; this panel only edits model names and parameters, stored in the Worker's KV.
const WORKER_URL = 'https://bitacora-worker.matiaschushig23.workers.dev';
const AI_PROV = { nanogpt:{label:'NanoGPT', secret:'NANOGPT_API_KEY'}, gemini:{label:'Gemini', secret:'GEMINI_API_KEY'} };
const AI_RANGES = { temperature:[0,2], top_p:[0,1], max_tokens:[1,200000] };
const AI_RESERVED = ['model','messages','stream','stream_options','n'];
const AI_MAX_FAV = 20, AI_LIST_MAX = 80;
const AI = { loaded:false, loading:false, err:null, prov:null, draft:null, saved:'', models:{}, modelsErr:{}, testMsg:'Responde solo: hola', ui:{} };
const provName = id => AI_PROV[id]?.label || id || '';

const API_MAX_MS = 130000;      // tope de una petición normal
const STREAM_IDLE_MS = 150000;  // el chat se corta si pasan 2,5 min sin recibir nada
async function api(path, { method='GET', body } = {}) {
  const user = auth.currentUser;
  if (!user || user.uid !== OWNER_UID) throw new Error('Ingresa con tu PIN para continuar.');
  const token = await user.getIdToken();
  let r; const limite = AbortSignal.timeout ? AbortSignal.timeout(API_MAX_MS) : undefined;
  try { r = await fetch(WORKER_URL + path, { method, body: body ? JSON.stringify(body) : undefined, signal: limite,
    headers: { Authorization: 'Bearer ' + token, ...(body ? { 'Content-Type':'application/json' } : {}) } }); }
  catch { throw new Error(limite?.aborted ? 'El Worker tardó demasiado en responder. Inténtalo de nuevo.' : 'No se pudo conectar con el Worker. Revisa tu conexión.'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(data.error || 'El Worker respondió ' + r.status); e.status = r.status; e.detalle = data.detalle; throw e; }
  return data;
}

// Same as api() but reads the Worker's line-by-line progress ({etapa}) until the final {fin} or {error}.
async function apiStream(path, body, onEtapa, ctl) {
  const user = auth.currentUser;
  if (!user || user.uid !== OWNER_UID) throw new Error('Ingresa con tu PIN para continuar.');
  const token = await user.getIdToken();
  // Se puede cortar a mano (botón Detener) o solo, si pasa demasiado tiempo sin recibir nada.
  const ac = ctl || new AbortController(); let idle = null, lento = false;
  const arm = () => { clearTimeout(idle); idle = setTimeout(() => { lento = true; ac.abort(); }, STREAM_IDLE_MS); };
  const corte = (otro) => { if (!ac.signal.aborted) return new Error(otro);
    const e = new Error(lento ? 'Kell tardó demasiado en responder. Reintenta; si ya había guardado algo, no se duplica.' : 'Envío detenido.'); e.detenido = !lento; return e; };
  arm();
  try {
    let r;
    try { r = await fetch(WORKER_URL + path, { method:'POST', body: JSON.stringify(body), signal: ac.signal,
      headers: { Authorization: 'Bearer ' + token, 'Content-Type':'application/json', Accept:'application/x-ndjson' } }); }
    catch { throw corte('No se pudo conectar con el Worker. Revisa tu conexión.'); }
    if (!r.ok || !(r.headers.get('Content-Type') || '').includes('ndjson') || !r.body) {
      const data = await r.json().catch(() => ({}));
      if (!r.ok) { const e = new Error(data.error || 'El Worker respondió ' + r.status); e.status = r.status; throw e; }
      return data;
    }
    const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = ''; let fin = null;
    const linea = l => { if (!l.trim()) return; let o; try { o = JSON.parse(l); } catch { return; }
      if (o.etapa) onEtapa?.(o.etapa); else if (o.fin) fin = o.fin; else if (o.error) { const e = new Error(o.error); e.status = o.status; throw e; } };
    for (;;) { let paso; try { paso = await reader.read(); } catch { throw corte('Se perdió la conexión a mitad de la respuesta. Reintenta.'); }
      if (paso.done) break; arm(); buf += dec.decode(paso.value, { stream:true });
      let i; while ((i = buf.indexOf('\n')) >= 0) { linea(buf.slice(0, i)); buf = buf.slice(i + 1); } }
    linea(buf);
    if (!fin) throw new Error('La respuesta se cortó. Reintenta.');
    return fin;
  } finally { clearTimeout(idle); }
}

// Form state keeps numbers as typed text; fromDraft validates like the Worker does.
const aiToDraft = c => ({ principal:{...c.principal}, respaldo: c.respaldo ? {...c.respaldo} : null, rapido: c.rapido ? {...c.rapido} : null, favoritos:(c.favoritos||[]).map(f=>({...f})),
  temperature: c.parametros?.temperature ?? '', top_p: c.parametros?.top_p ?? '', max_tokens: c.parametros?.max_tokens ?? '',
  extra: c.extra && Object.keys(c.extra).length ? JSON.stringify(c.extra, null, 2) : '' });
function aiFromDraft(d) {
  const err = {}, parametros = {};
  for (const [k,[lo,hi]] of Object.entries(AI_RANGES)) {
    const raw = String(d[k] ?? '').trim().replace(',', '.'); if (!raw) continue;
    const n = Number(raw);
    if (!Number.isFinite(n) || n < lo || n > hi || (k === 'max_tokens' && !Number.isInteger(n)))
      err[k] = k === 'max_tokens' ? `Escribe un número entero entre ${lo} y ${hi.toLocaleString('es')}.` : `Escribe un número entre ${lo} y ${hi}.`;
    else parametros[k] = n;
  }
  let extra = {}; const ex = String(d.extra || '').trim();
  if (ex) {
    try { extra = JSON.parse(ex); if (!extra || typeof extra !== 'object' || Array.isArray(extra)) throw 0;
      const bad = Object.keys(extra).find(k => AI_RESERVED.includes(k));

// Readable reason for a provider failure, with a hint in Spanish.
function aiReason(f) {
  const st = Number(String(f.error || '').match(/respondió (\d{3})/)?.[1]);
  const raw = typeof f.detalle === 'string' ? f.detalle : '';
  const msg = (raw.match(/"message"\s*:\s*"((?:[^"\\]|\\.)*)"/)?.[1] || raw).replace(/\\n/g, ' ').replace(/\\"/g, '"').trim().slice(0, 220);
  let hint = { 400:'El proveedor rechazó la petición; revisa los parámetros.', 401:'La clave no es válida; revísala en Cloudflare.', 402:'No hay saldo en el proveedor.',
    403:'La clave no tiene permiso para este modelo.', 404:'El modelo no está disponible o fue retirado; elige otro.', 429:'Se alcanzó el límite de uso; espera un momento o usa el respaldo.' }[st];
  if (/api key/i.test(msg)) hint = 'La clave no es válida; revísala en Cloudflare.';
  return [hint || f.error || 'Error desconocido', msg && msg !== hint ? `(${msg})` : ''].filter(Boolean).join(' ');
}

async function audioStart(file, folder) {

    });

    const esc = t => t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const html = fin.texto.split(/\n+/).map(l => l.trim()).filter(Boolean)
      .map(l => { const m = l.match(/^\[(\d{1,2}:\d{2}(?::\d{2})?)\]\s*(.*)$/); return m ? `<p><b>[${m[1]}]</b> ${esc(m[2])}</p>` : `<p>${esc(l)}</p>`; }).join('')
      + (fin.incompleta ? '<p><i>La transcripción quedó incompleta: el audio es demasiado largo para una sola respuesta. Divide el audio y transcribe el resto.</i></p>' : '');
    const id = uid(); const base = file.name.replace(/\.[^.]+$/, '');

    done(); const open = AUDIO.job === j && !!$('#audioEtapa'); AUDIO.job = null; onData();
    if (open) closeSheet().then(() => openFile(id)); else toast('Transcripción lista: ' + base);
  } catch (e) { done(e.message); }
}

  const apply = () => { wrap.classList.toggle('split', mode==='split'); ta.classList.toggle('hide', mode==='view'); prev.classList.toggle('hide', mode==='edit');
    seg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.m===mode))); if (mode!=='edit') renderMd(ta.value, prev); };
  let pt; const rerender = () => { clearTimeout(pt); pt = setTimeout(()=>{ if (mode!=='edit') renderMd(ta.value, prev); }, 140); };
  const micB = SpeechRec ? tb('mic','Dictar por voz',()=>{ if (mode === 'view') { mode = 'edit'; apply(); } dictToggleTarget({kind:'note',id:S.fileId}); }) : null;
  const tools = h('div',{class:'ed-tools',role:'toolbar','aria-label':'Formato Markdown'}, micB, micB ? tsep() : null, seg, tsep(),
    tb('<span style="font-family:var(--f-display);font-weight:700">H1</span>','Título',()=>prefixLines(ta,'# ')), tb('<span style="font-family:var(--f-display);font-weight:700">H2</span>','Subtítulo',()=>prefixLines(ta,'## ')),
    tb('<b>B</b>','Negrita',()=>insertAround(ta,'**','**')), tb('<i style="font-family:Georgia,serif">I</i>','Cursiva',()=>insertAround(ta,'*','*')),
    tb('list','Lista',()=>prefixLines(ta,'- ')), tb('olist','Lista numerada',()=>prefixLines(ta,'1. ')), tb('check','Tarea',()=>prefixLines(ta,'- [ ] ')),
    tb('quote','Cita',()=>prefixLines(ta,'> ')), tb('code','Bloque de código',()=>insertAround(ta,'\n```python\n','\n```\n','print("hola")')),
    tb('table','Tabla',()=>insertAround(ta,'\n| Columna 1 | Columna 2 |\n|---|---|\n| ','| valor |\n','valor ')), tb('link','Enlace',()=>insertAround(ta,'[','](https://)','texto')));
  ta.addEventListener('input', () => { changed(); rerender(); });
  ta.addEventListener('blur', flushSave);
  ta.addEventListener('keydown', e => { if (e.key==='Tab') { e.preventDefault(); insertAround(ta,'    ','',''); } });
  wrap.append(ta, prev); host.append(wrap); if (S.canWrite) host.append(tools); apply();
  return { getContent:()=>ta.value, setContent:v=>{ ta.value=v; if (mode!=='edit') renderMd(v, prev); }, isFocused:()=>document.activeElement===ta, text:()=>ta.value,
    stats:()=>{ const n = countWords(ta.value); return `${n.toLocaleString('es')} palabra${n===1?'':'s'}`; } };
}

/* Code */
function codeEditor(host, it) {
  const wrap = h('div',{class:'code-wrap'+(S.wrap?' wrapl':'')});
  const pre = h('pre',{'aria-hidden':'true'}); const code = h('code',{class:'hljs'}); pre.append(code);
  const ta = h('textarea',{spellcheck:'false',autocapitalize:'off',autocomplete:'off','aria-label':'Código',wrap:S.wrap?'soft':'off',readonly:!S.canWrite}); ta.value = it.content||'';
  const lang = h('select',{'aria-label':'Lenguaje',disabled:!S.canWrite}); LANGS.forEach(([v,l])=>lang.append(h('option',{value:v},l))); lang.value = it.lang || 'python';
  const paint = () => { let v = ta.value; if (v.endsWith('\n') || !v) v += ' '; const L = lang.value;
    try { code.innerHTML = (window.hljs && L!=='plaintext' && hljs.getLanguage(L)) ? hljs.highlight(v,{language:L, ignoreIllegals:true}).value : v.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); } catch { code.textContent = v; } };
  if (!window.hljs) loadHljs().then(() => { if (ta.isConnected) paint(); }).catch(() => {});
  const sync = () => { pre.scrollTop = ta.scrollTop; pre.scrollLeft = ta.scrollLeft; };
  lang.addEventListener('change', () => { Store.patch(S.fileId, {lang:lang.value, updated:Date.now()}); paint(); updateMeta(); });
  const wrapBtn = tb('<span style="font-size:13px;font-weight:600">Ajustar líneas</span>','Ajuste de línea',()=>{ S.wrap=!S.wrap; remember(); wrap.classList.toggle('wrapl',S.wrap); ta.setAttribute('wrap', S.wrap?'soft':'off'); wrapBtn.classList.toggle('on',S.wrap); sync(); }, 'txt'+(S.wrap?' on':''));
  const tools = h('div',{class:'ed-tools',role:'toolbar','aria-label':'Opciones de código'}, h('span',{class:'tb'}, lang), tsep(),
    tb('<span style="font-size:13px;font-weight:600">Comentar</span>','Comentar líneas',()=>{ const pfx = ({python:'# ',r:'# ',bash:'# ',sql:'-- '})[lang.value] || '// '; prefixLines(ta, pfx); }, 'txt'),
    tb('<span style="font-size:13px;font-weight:600">Sangría</span>','Aumentar sangría',()=>prefixLines(ta,'    '), 'txt'),
    tb('<span style="font-family:var(--f-mono);font-size:14px">{ }</span>','Insertar llaves',()=>insertAround(ta,'{','}','')),
    tb('<span style="font-family:var(--f-mono);font-size:14px">( )</span>','Insertar paréntesis',()=>insertAround(ta,'(',')','')), tsep(), wrapBtn);
  ta.addEventListener('input', () => { paint(); sync(); changed(); });
  ta.addEventListener('scroll', sync);
  ta.addEventListener('blur', flushSave);
  ta.addEventListener('keydown', e => {
    if (e.key==='Tab') { e.preventDefault(); if (ta.selectionStart!==ta.selectionEnd) prefixLines(ta,'    '); else insertAround(ta,'    ','',''); }
    if (e.key==='Enter') { const v=ta.value, s=ta.selectionStart; const ls=v.lastIndexOf('\n', s-1)+1; const ind=(v.slice(ls,s).match(/^[ \t]*/)||[''])[0];
      const extra = /[:{\[(]\s*$/.test(v.slice(ls,s)) ? '    ' : ''; if (ind||extra) { e.preventDefault(); insertAround(ta,'\n'+ind+extra,'',''); } }
  });
  wrap.append(pre, ta); host.append(wrap); if (S.canWrite) host.append(tools); paint();
  return { getContent:()=>ta.value, setContent:v=>{ ta.value=v; paint(); }, isFocused:()=>document.activeElement===ta, text:()=>ta.value,
    stats:()=>{ const n = ta.value.split('\n').length; return `${n} línea${n===1?'':'s'}`; } };
}

/* ================= File actions ================= */
function saveBlob(filename, data, type) {
  const u = URL.createObjectURL(new Blob([data], {type})); const a = h('a',{href:u, download:filename});
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 3000);
}
function htmlDoc(title, body) { return `<!doctype html><html lang="es"><head><meta charset="utf-8"><title>${title.replace(/</g,'&lt;')}</title><style>body{font-family:system-ui,sans-serif;max-width:72ch;margin:40px auto;padding:0 16px;line-height:1.6}pre{background:#f2f4f1;padding:12px;border-radius:8px;overflow:auto}blockquote{border-left:3px solid #1d5c46;margin:0;padding-left:1em;color:#555}</style></head><body>${body}</body></html>`; }
function fileExport(id) { if (S.view==='editor') flushSave(); const it = get(id); if (!it) return;
  const base = it.name.replace(/\.[a-z0-9]{1,5}$/i,'').replace(/[\\/:*?"<>|]+/g,'-').trim() || 'nota';
  let filename, data;
  if (it.format==='rich') { filename = base+'.html'; data = htmlDoc(it.name, DOMPurify.sanitize(it.content||'')); }
  else if (it.format==='md') { filename = base+'.md'; data = it.content||''; }
  else { filename = base+'.'+langInfo(it.lang)[2]; data = it.content||''; }
  saveBlob(filename, data, 'text/plain;charset=utf-8'); toast('Descargado: '+filename);
}
function convertTo(id, fmt, confirmado=false) { if (S.view==='editor') flushSave(); const it = get(id); if (!it || it.format===fmt) return;
  // De texto con formato a Markdown o código solo queda el texto: se avisa antes porque no se puede recuperar.
  if (it.format==='rich' && !confirmado && /<(b|i|u|s|strong|em|h[1-6]|ul|ol|a|span|blockquote|pre|table|mark|font)\b/i.test(it.content||'')) {
    openSheet({ title:'Convertir a '+FORMATS[fmt].long, confirm:'Convertir', body:[h('p',{class:'sheet-p',text:'Esta nota tiene formato (negritas, títulos, listas o colores). Al convertirla queda solo el texto y ese formato no se puede recuperar.'})],
      onConfirm: () => { convertTo(id, fmt, true); } });
    return;
  }
  let content = it.content||'';
  if (it.format==='rich') content = plainOf(it);
  if (fmt==='rich') content = it.format==='md' ? DOMPurify.sanitize(marked.parse(content,{gfm:true,breaks:true})) : '<pre><code>'+content.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</code></pre>';
  if (fmt==='md' && it.format==='code') content = '```'+(it.lang||'')+'\n'+content+'\n```\n';
  const part = {format:fmt, content, updated:Date.now()}; if (fmt==='code') part.lang = it.lang || 'python';
  Store.patch(id, part); toast('Convertido a '+FORMATS[fmt].long);
  if (S.view==='editor' && S.fileId===id) render(); else onData();
}
function backup() { if (S.view==='editor') flushSave(); const d = new Date().toISOString().slice(0,10);
  saveBlob('bitacora-respaldo-' + d + '.json', JSON.stringify({app:'bitacora', version:2, exported:Date.now(), items:Object.fromEntries(S.items)}, null, 2), 'application/json');
  toast('Respaldo descargado'); }
function restore() {
  const inp = h('input',{type:'file',accept:'.json,application/json'});
  inp.onchange = async () => { const f = inp.files[0]; if (!f) return; let data;
    try { data = JSON.parse(await f.text()); } catch { toast('El archivo no es un respaldo válido.'); return; }
    const items = data && data.items; if (!items || typeof items !== 'object') { toast('El archivo no es un respaldo de Bitácora.'); return; }
    const ids = Object.keys(items).filter(id => /^[A-Za-z0-9_-]{1,100}$/.test(id) && items[id] && ['file','folder','clip'].includes(items[id].type));
    if (!ids.length) { toast('El respaldo no contiene notas.'); return; }
    openSheet({ title:'Restaurar respaldo', confirm:'Restaurar', body:[h('p',{text:`Se restaurarán ${ids.length} elementos. Los que ya existan se reemplazarán por la versión del respaldo; el resto de tus notas no cambia.`})],
      onConfirm: async () => { try { for (let i = 0; i < ids.length; i += 400) { const b = fdb.batch(); ids.slice(i, i+400).forEach(id => b.set(Store.col.doc(id), items[id])); await b.commit(); } toast('Respaldo restaurado'); }
        catch (e) { toast('No se pudo restaurar (' + (e.code||'error') + ').'); } } });
  };
  inp.click();
}
function loadExamples() {
  const now = Date.now(); const f1 = uid();
  Store.set(f1, {type:'folder', name:'Ejemplos', parent:null, color:'c4', created:now, updated:now});
  Store.set(uid(), {type:'file', parent:f1, format:'rich', name:'Bienvenida (ejemplo)', created:now, updated:now, content:'<h1>Tu Bitácora</h1><p>Usa la barra de abajo para dar formato: <b>negrita</b>, <span style="background-color: var(--hc0)">resaltado</span> y listas.</p><ul data-check=""><li data-checked="true">Crear una carpeta</li><li data-checked="false">Pegar mis apuntes</li></ul>'});
  Store.set(uid(), {type:'file', parent:f1, format:'md', name:'Guía de Markdown (ejemplo)', created:now, updated:now, content:'# Guía rápida\n\n- **Negrita** con `**texto**`\n- *Cursiva* con `*texto*`\n\n| Comando | Uso |\n|---|---|\n| `SELECT` | Leer filas |\n'});
  Store.set(uid(), {type:'file', parent:f1, format:'code', lang:'python', name:'promedio.py (ejemplo)', created:now, updated:now, content:'def promedio(valores):\n    return sum(valores) / len(valores) if valores else 0.0\n\nprint(promedio([8.5, 9.0, 7.25, 10]))\n'});
  onData(); toast('Se cargaron 3 notas de ejemplo');
}

/* ================= Global wiring ================= */
document.addEventListener('keydown', e => { if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s') { e.preventDefault(); if (S.view==='editor' && S.canWrite) { S.dirty = true; flushSave(); toast('Guardado'); } } });
document.addEventListener('visibilitychange', () => { if (document.hidden) flushSave(); });
window.addEventListener('pagehide', flushSave);
setInterval(() => { if (S.view==='editor' && !S.dirty) updateMeta(); }, 30000);

// Accesos directos de la app instalada (?v=assistant, ?v=panel) abren esa sección.
const vIni = new URLSearchParams(location.search).get('v');
const vista0 = ['assistant','panel','files'].includes(vIni) ? vIni : 'home';
history.replaceState({ view:vista0, depth:0 }, '', location.pathname);
S.view = vista0;
render();
if ('serviceWorker' in navigator && isSecureContext && location.protocol !== 'file:') navigator.serviceWorker.register('/sw.js').catch(() => {});
auth.onAuthStateChanged(u => { S.isOwner = !!u && u.uid === OWNER_UID; if (!S.isOwner) dictEnd(); S.authKnown = true; if (u && !S.isOwner) auth.signOut();
  // Sesión recordada: deja lista la copia sin conexión. Sin sesión de dueño no debe quedar copia en el equipo.
  let temp = false; try { temp = localStorage.getItem('bitacora.temp') === '1'; } catch {}
  if (S.isOwner && !temp) offlineMark(true);
  else if (!S.isOwner && !lockingNow && OFFLINE.on) { offlineWipe(); return; }
  else if (!S.isOwner) offlineMark(false);
  recompute(); });
var accessUnsub = fdb.doc('config/access').onSnapshot(snap => { const m = snap.exists ? snap.data().mode : 'private'; S.access = MODES[m] ? m : 'private'; recompute(); }, () => { S.access = 'private'; recompute(); });
})();
