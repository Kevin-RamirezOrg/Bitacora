<style>
/* Pizarra: chalkboard green, chalk-white type, one pastel per subject. Dark first; light = whiteboard. */
:root{
  color-scheme:dark;
  --bg:#1C2723; --surface:#24322D; --surface-2:#2D3D37; --surface-3:#384A42;
  --line:#33453E; --line-strong:#7D938A;
  --ink:#EEF1E8; --ink-2:#D3DBD0; --muted:#A9B7AD;
  --accent:#F2D67A; --on-accent:#1C2723; --accent-ink:#F2D67A; --accent-soft:rgba(242,214,122,.16);
  --danger:#FF9187; --danger-soft:rgba(255,145,135,.14); --ok:#8FD9A8; --warn:#F5C26B;
  --scrim:rgba(6,12,10,.62); --shadow:0 14px 36px rgba(0,0,0,.45);
  --c0:#F28B82; --c1:#F5B987; --c2:#F2D67A; --c3:#A8DDB5; --c4:#8FD5CF; --c5:#9CC7E8; --c6:#C9B6F0; --c7:#F2A7B8; --c8:#C3CCC5;
  --tc0:#FF9C93; --tc1:#F8BE86; --tc2:#9FE0B1; --tc3:#9DCBF0; --tc4:#CDB9F5; --tc5:#F5A9C0;
  --hc0:rgba(242,214,122,.30); --hc1:rgba(143,217,168,.26); --hc2:rgba(156,199,232,.26); --hc3:rgba(242,167,184,.26); --hc4:rgba(245,185,135,.28);
  --sx-k:#C9B6F0; --sx-s:#A8DDB5; --sx-n:#F5B987; --sx-c:#8C9C92; --sx-f:#9CC7E8; --sx-t:#F2D67A; --sx-a:#8FD5CF;
  --f-display:"Lora", Georgia, "Times New Roman", serif;
  --f-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-pill:999px;
  --tab-h:68px;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#F2F4F1; --surface:#FFFFFF; --surface-2:#E7ECE6; --surface-3:#DAE1D9;
  --line:#DCE2DB; --line-strong:#76877E;
  --ink:#16201C; --ink-2:#2C3933; --muted:#55655D;
  --accent:#1D5C46; --on-accent:#FFFFFF; --accent-ink:#1D5C46; --accent-soft:rgba(29,92,70,.12);
  --danger:#C42B21; --danger-soft:rgba(196,43,33,.10); --ok:#1F7A4D; --warn:#9A6200;
  --scrim:rgba(18,28,24,.45); --shadow:0 14px 34px rgba(22,32,28,.16);
  --c0:#D23A31; --c1:#C25E0C; --c2:#9A7400; --c3:#1E8553; --c4:#0B7C79; --c5:#1F63C4; --c6:#6743D6; --c7:#BE2F67; --c8:#5F6E66;
  --tc0:#C42B21; --tc1:#B35400; --tc2:#1C7A4B; --tc3:#1D5FBF; --tc4:#6240CF; --tc5:#B62A61;
  --hc0:rgba(255,214,10,.42); --hc1:rgba(48,164,108,.26); --hc2:rgba(0,144,255,.20); --hc3:rgba(214,64,159,.20); --hc4:rgba(247,107,21,.24);
  --sx-k:#6240CF; --sx-s:#1C7A4B; --sx-n:#B35400; --sx-c:#6F7D75; --sx-f:#1D5FBF; --sx-t:#9A6200; --sx-a:#0B7C79;
}}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#F2F4F1; --surface:#FFFFFF; --surface-2:#E7ECE6; --surface-3:#DAE1D9;
  --line:#DCE2DB; --line-strong:#76877E;
  --ink:#16201C; --ink-2:#2C3933; --muted:#55655D;
  --accent:#1D5C46; --on-accent:#FFFFFF; --accent-ink:#1D5C46; --accent-soft:rgba(29,92,70,.12);
  --danger:#C42B21; --danger-soft:rgba(196,43,33,.10); --ok:#1F7A4D; --warn:#9A6200;
  --scrim:rgba(18,28,24,.45); --shadow:0 14px 34px rgba(22,32,28,.16);
  --c0:#D23A31; --c1:#C25E0C; --c2:#9A7400; --c3:#1E8553; --c4:#0B7C79; --c5:#1F63C4; --c6:#6743D6; --c7:#BE2F67; --c8:#5F6E66;
  --tc0:#C42B21; --tc1:#B35400; --tc2:#1C7A4B; --tc3:#1D5FBF; --tc4:#6240CF; --tc5:#B62A61;
  --hc0:rgba(255,214,10,.42); --hc1:rgba(48,164,108,.26); --hc2:rgba(0,144,255,.20); --hc3:rgba(214,64,159,.20); --hc4:rgba(247,107,21,.24);
  --sx-k:#6240CF; --sx-s:#1C7A4B; --sx-n:#B35400; --sx-c:#6F7D75; --sx-f:#1D5FBF; --sx-t:#9A6200; --sx-a:#0B7C79;
}

/* Palette: Uva (purple). Same structure as Pizarra; the light variant wins by higher specificity. */
:root[data-palette="uva"]{ --bg:#221B2B; --surface:#2B2236; --surface-2:#352A42; --surface-3:#40334F; --line:#3B3048; --line-strong:#8F80A4; --ink:#F1EDF5; --ink-2:#D9D1E3; --muted:#B3A7C2; --accent:#C9AEFF; --on-accent:#221B2B; --accent-ink:#C9AEFF; --accent-soft:rgba(201,174,255,.17); --scrim:rgba(12,8,18,.62); }
@media (prefers-color-scheme: light){:root[data-palette="uva"]:not([data-theme="dark"]){ color-scheme:light; --bg:#F5F2F8; --surface:#FFFFFF; --surface-2:#ECE6F2; --surface-3:#DFD7E8; --line:#E2DAEA; --line-strong:#7F7196; --ink:#1E1828; --ink-2:#352C42; --muted:#5F5471; --accent:#6A3FC2; --on-accent:#FFFFFF; --accent-ink:#6A3FC2; --accent-soft:rgba(106,63,194,.12); --scrim:rgba(24,16,34,.45); }}
:root[data-palette="uva"][data-theme="light"]{ color-scheme:light; --bg:#F5F2F8; --surface:#FFFFFF; --surface-2:#ECE6F2; --surface-3:#DFD7E8; --line:#E2DAEA; --line-strong:#7F7196; --ink:#1E1828; --ink-2:#352C42; --muted:#5F5471; --accent:#6A3FC2; --on-accent:#FFFFFF; --accent-ink:#6A3FC2; --accent-soft:rgba(106,63,194,.12); --scrim:rgba(24,16,34,.45); }

*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%;background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
svg{flex:none}

/* ---------- App frame ---------- */
.app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.pad{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;width:100%}

/* ---------- Tab bar ---------- */
.tabbar{flex:none;display:flex;align-items:center;justify-content:space-around;height:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));padding:0 max(6px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(6px,env(safe-area-inset-left,0px));background:var(--bg);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:64px;height:56px;border-radius:var(--r-md);font-size:12px;font-weight:600;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .tab-ic{background:var(--accent-soft);color:var(--accent-ink)}
.tab-ic{width:52px;height:30px;border-radius:var(--r-pill);display:grid;place-items:center}
.fab{width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.35);margin-top:-22px;border:3px solid var(--bg)}
.fab svg{width:28px;height:28px}
.app.in-editor .tabbar{display:none}

/* ---------- Headers ---------- */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-top:14px;padding-bottom:6px}
.date{font-size:14px;color:var(--muted);font-weight:500}
.big{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.15;margin:2px 0 0;letter-spacing:-.01em;text-wrap:balance}
.chalk{position:relative;display:inline-block}
.chalk::after{content:"";position:absolute;left:-2px;right:-8px;bottom:-5px;height:6px;border-radius:6px;background:var(--accent);opacity:.9;transform:rotate(-1.4deg)}
.page-h{display:flex;align-items:center;gap:6px;min-height:56px;padding-top:6px;padding-bottom:6px}
.page-h h1{font-family:var(--f-display);font-weight:700;font-size:26px;margin:0;line-height:1.2;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb{font-size:13px;color:var(--muted);font-weight:500;margin-bottom:-2px}

/* ---------- Controls ---------- */
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink);position:relative;flex:none}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn.solid{background:var(--surface-2);border:1px solid var(--line-strong)}
.icon-btn svg{width:22px;height:22px}
.status-dot{position:absolute;right:6px;top:6px;width:10px;height:10px;border-radius:50%;border:2px solid var(--bg);background:var(--muted)}
.status-dot.ok{background:var(--ok)}.status-dot.warn{background:var(--warn)}.status-dot.err{background:var(--danger)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r-pill);font-weight:600;font-size:15px;white-space:nowrap;border:1.5px solid transparent}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.secondary{background:var(--surface-2);color:var(--ink);border-color:var(--line-strong)}
.btn.ghost{color:var(--accent-ink);padding:0 10px}
.btn.danger{background:var(--danger);color:#1A0E0C}
:root[data-theme="light"] .btn.danger{color:#fff}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .btn.danger{color:#fff}}
.btn.wide{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.link{color:var(--accent-ink);font-weight:600;font-size:15px;min-height:44px;display:inline-flex;align-items:center;padding:0 4px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field > label{font-size:14px;font-weight:600;color:var(--ink-2)}
.input,.select,.textarea{width:100%;min-height:48px;border-radius:var(--r-md);background:var(--surface-2);border:1.5px solid var(--line-strong);padding:10px 14px;font-size:16px}
.textarea{min-height:140px;resize:vertical;font-family:var(--f-mono);font-size:14px;line-height:1.55}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--accent)}
.search-field{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;border-radius:var(--r-pill);background:var(--surface);border:1.5px solid var(--line-strong);padding:0 16px;color:var(--muted);font-size:16px;text-align:left}
.search-field svg{width:20px;height:20px;color:var(--ink-2)}
input.search-field{color:var(--ink)}
input.search-field::placeholder{color:var(--muted)}
.seg{display:inline-flex;background:var(--surface-2);border:1.5px solid var(--line-strong);border-radius:var(--r-pill);padding:3px;gap:2px}
.seg button{min-height:38px;padding:0 14px;border-radius:var(--r-pill);font-size:14px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

/* ---------- Sections ---------- */
.sec{margin-top:26px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-h h2{font-family:var(--f-display);font-weight:600;font-size:21px;margin:0}
.note-bar{margin-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.note-bar.alert{background:var(--danger-soft);border-color:var(--danger);color:var(--ink)}
.note-bar .link{min-height:32px}

/* Hoy */
.hoy{border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);padding:16px;display:flex;gap:14px;align-items:flex-start}
.hoy-ic{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.hoy p{margin:0;color:var(--ink-2);font-size:15px}
.hoy small{display:block;margin-top:6px;color:var(--muted);font-size:13px}

/* Clipboard */
.clip{position:relative;border-radius:var(--r-lg);border:1.5px dashed var(--line-strong);background:var(--surface);padding:16px}
.clip-text{font-family:var(--f-mono);font-size:14px;line-height:1.55;color:var(--ink);white-space:pre-wrap;word-break:break-word;margin:0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.clip-empty{color:var(--muted);font-size:15px;margin:0}
.clip-acts{display:flex;gap:8px;margin-top:14px;align-items:center;flex-wrap:wrap}
.clip-when{margin-left:auto;font-size:13px;color:var(--muted)}

/* Folders row */
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:4px;margin:0 calc(-1 * max(18px,env(safe-area-inset-left,0px)));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.ftile{flex:none;width:136px;min-height:112px;scroll-snap-align:start;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--fc,var(--c8));padding:14px 14px 12px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.ftile b{font-size:15px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ftile span{font-size:13px;color:var(--muted)}
.ftile.add{border:1.5px dashed var(--line-strong);border-top-width:1.5px;align-items:flex-start;color:var(--ink-2)}
.ftile.add svg{width:24px;height:24px;color:var(--accent-ink)}

/* Lists */
.list{display:flex;flex-direction:column;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 6px 8px 14px;text-align:left;width:100%;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row:active{background:var(--surface-2)}
.row-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--fc,var(--ink-2));flex:none}
.row-ic svg{width:20px;height:20px}
.row-t{flex:1;min-width:0}
.row-t b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-t span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-w{font-size:13px;color:var(--muted);white-space:nowrap;padding-right:6px}
.row .icon-btn{color:var(--ink-2)}
.chev{color:var(--muted);margin-right:8px}
.empty{text-align:center;padding:36px 20px;border-radius:var(--r-lg);border:1.5px dashed var(--line-strong)}
.empty h3{font-family:var(--f-display);font-size:20px;margin:6px 0}
.empty p{color:var(--muted);margin:0 auto 16px;max-width:36ch}
.empty .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.bottom-space{height:28px}

/* ---------- Editor ---------- */
.ed-top{display:flex;align-items:center;gap:4px;min-height:56px;padding-top:4px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.ed-back{display:flex;align-items:center;gap:2px;min-height:44px;padding:0 10px 0 4px;border-radius:var(--r-pill);color:var(--accent-ink);font-weight:600;font-size:16px;min-width:0;max-width:60%}
.ed-back span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-back svg{width:24px;height:24px}
.ed-top .sp{flex:1}
.ed-head{padding-top:14px;padding-bottom:6px}
.ed-title{width:100%;border:0;background:transparent;font-family:var(--f-display);font-weight:700;font-size:27px;line-height:1.2;padding:2px 0;color:var(--ink)}
.ed-title:focus{outline:none}
.ed-title::placeholder{color:var(--muted)}
.ed-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:var(--r-pill);background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);font-weight:600;font-size:12px}
.save-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.save-dot.busy{background:var(--warn)}.save-dot.err{background:var(--danger)}
.ed-body{flex:1;min-height:0;display:flex;flex-direction:column}
.ed-tools{flex:none;display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none;padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));background:var(--surface);border-top:1px solid var(--line)}
.ed-tools::-webkit-scrollbar{display:none}
.tb{flex:none;min-width:44px;height:44px;padding:0 8px;border-radius:12px;display:inline-grid;place-items:center;color:var(--ink);font-size:16px;font-weight:700}
.tb svg{width:22px;height:22px}
.tb:active,.tb.on{background:var(--accent-soft);color:var(--accent-ink)}
.tb.txt{font-size:14px;font-weight:600;padding:0 12px}
.tsep{flex:none;width:1px;height:26px;background:var(--line-strong);margin:0 4px;opacity:.6}
.tb select{min-height:40px;border-radius:10px;background:var(--surface-2);border:1.5px solid var(--line-strong);padding:0 10px;font-size:14px;font-weight:600}

.prose{font-size:17px;line-height:1.65;color:var(--ink);max-width:70ch;width:100%;margin:0 auto}
.prose h1{font-family:var(--f-display);font-size:28px;line-height:1.25;margin:.7em 0 .3em;text-wrap:balance}
.prose h2{font-family:var(--f-display);font-size:22px;line-height:1.3;margin:.9em 0 .3em;text-wrap:balance}
.prose h3{font-size:18px;margin:.9em 0 .3em}
.prose p{margin:.45em 0}
.prose a{color:var(--accent-ink);text-underline-offset:3px}
.prose blockquote{margin:.8em 0;padding:.3em 1em;border-left:4px solid var(--accent);color:var(--ink-2);background:var(--surface);border-radius:0 10px 10px 0}
.prose code{font-family:var(--f-mono);font-size:.86em;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:.08em .38em}
.prose pre{font-family:var(--f-mono);font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;overflow-x:auto;line-height:1.55}
.prose pre code{background:none;border:0;padding:0;font-size:inherit}
.prose table{border-collapse:collapse;display:block;overflow-x:auto;max-width:100%}
.prose th,.prose td{border:1px solid var(--line-strong);padding:7px 10px;text-align:left}
.prose th{background:var(--surface-2)}
.prose hr{border:0;border-top:2px dashed var(--line-strong);margin:1.4em 0}
.prose img{max-width:100%;border-radius:10px}
.prose ul,.prose ol{padding-left:1.4em}
.prose ul[data-check]{list-style:none;padding-left:2px}
.prose ul[data-check] li{position:relative;padding-left:34px;margin:6px 0;min-height:26px}
.prose ul[data-check] li::before{content:"";position:absolute;left:0;top:.18em;width:22px;height:22px;border:2px solid var(--line-strong);border-radius:7px;cursor:pointer;background:var(--surface)}
.prose ul[data-check] li[data-checked="true"]{color:var(--muted);text-decoration:line-through}
.prose ul[data-check] li[data-checked="true"]::before{background:var(--accent);border-color:var(--accent)}

/* ---------- Assistant (chat → Notion through the Worker) ---------- */
const CHAT = { loaded:false, loading:false, err:null, msgs:[], more:false, estado:null, config:null, sending:false, failed:null, draft:'', olderLoading:false };
const CHAT_EXAMPLES = ['prueba de big data el martes 2','entregar deber de compiladores el viernes','las pruebas de fundamentos son de opción múltiple','¿qué tengo esta semana?'];
const chatModelKey = () => pref('bitacora.chatModelo', '');
const localDay = (d=new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const daysUntil = f => Math.round((Date.parse(f + 'T12:00:00Z') - Date.parse(localDay() + 'T12:00:00Z')) / 86400000);
const fmtDay = (f, opts={weekday:'short',day:'numeric',month:'short'}) => new Date(f + 'T12:00:00').toLocaleDateString('es', opts);
const fmtDue = (f, hora) => f ? fmtDay(f) + (hora ? ', ' + hora : '') : 'Sin fecha';
const shortModel = m => String(m || '').split('/').pop();

async function chatLoad() {
  if (CHAT.loading) return; CHAT.loading = true; CHAT.err = null;
  const [est, cfg, hist] = await Promise.allSettled([api('/asistente/estado'), api('/config/ia'), api('/asistente/historial?limite=50')]);
  CHAT.estado = est.status === 'fulfilled' ? est.value : null;
  CHAT.config = cfg.status === 'fulfilled' ? cfg.value.config : null;
  if (hist.status === 'fulfilled') { CHAT.msgs = hist.value.mensajes; CHAT.more = CHAT.msgs.length >= 50; }
  else if (CHAT.estado && !CHAT.estado.historial) CHAT.msgs = [];
  else CHAT.err = hist.reason?.message || 'No se pudo cargar el chat.';
  if (!CHAT.err) CHAT.loaded = true;
  CHAT.loading = false; chatPaint(true);
}
function chatPaint(toBottom=false) {
  if (S.view !== 'assistant') return;
  const prev = $('#screen .scroll'); const fromBottom = prev ? prev.scrollHeight - prev.scrollTop : 0;
  const focused = document.activeElement?.id === 'chatIn';
  render();
  const sc = $('#screen .scroll'); if (!sc) return;
  sc.scrollTop = toBottom ? sc.scrollHeight : sc.scrollHeight - fromBottom;
  if (focused) $('#chatIn')?.focus({preventScroll:true});
}
function chatModelo() { // favorite picked in the chat, or null = saved principal
  const key = chatModelKey(); if (!key) return null;
  const f = (CHAT.config?.favoritos || []).find(x => `${x.proveedor}/${x.modelo}` === key);
  if (!f) { setPref('bitacora.chatModelo', null); return null; }
  return f;
}
async function chatSend(text) {
  text = String(text || '').trim(); if (!text || CHAT.sending) return;
  CHAT.sending = { texto:text }; CHAT.failed = null; CHAT.draft = ''; chatPaint(true);
  try {
    const modelo = chatModelo();
    const r = await api('/asistente/mensaje', { method:'POST', body: modelo ? { texto:text, modelo } : { texto:text } });
    CHAT.msgs.push(r.usuario, r.asistente);
  } catch (e) { CHAT.failed = { texto:text, error:e.message }; }
  finally { CHAT.sending = false; chatPaint(true); }
}
async function chatUndo(id, btn) {
  btn.disabled = true;
  try { const r = await api('/asistente/deshacer', { method:'POST', body:{ id } });
    const i = CHAT.msgs.findIndex(m => m.id === id); if (i >= 0) CHAT.msgs[i] = r.mensaje;
    toast('Cambios deshechos en Notion'); chatPaint(); }
  catch (e) { toast(e.message); btn.disabled = false; }
}
async function chatOlder(btn) {
  if (CHAT.olderLoading || !CHAT.msgs.length) return; CHAT.olderLoading = true; btn.disabled = true;
  try { const r = await api('/asistente/historial?limite=50&antes=' + CHAT.msgs[0].id);
    CHAT.msgs = [...r.mensajes, ...CHAT.msgs]; CHAT.more = r.mensajes.length >= 50; }
  catch (e) { toast(e.message); }
  finally { CHAT.olderLoading = false; chatPaint(); }
}

/* ---------- AI models (Ajustes → Modelos de IA) ---------- */
// Keys live in Cloudflare; this panel only edits model names and parameters, stored in the Worker's KV.
const WORKER_URL = 'https://bitacora-worker.matiaschushig23.workers.dev';
const AI_PROV = { nanogpt:{label:'NanoGPT', secret:'NANOGPT_API_KEY'}, gemini:{label:'Gemini', secret:'GEMINI_API_KEY'} };
const AI_RANGES = { temperature:[0,2], top_p:[0,1], max_tokens:[1,200000] };
const AI_RESERVED = ['model','messages','stream','stream_options','n'];
const AI_MAX_FAV = 20, AI_LIST_MAX = 80;
const AI = { loaded:false, loading:false, err:null, prov:null, draft:null, saved:'', models:{}, modelsErr:{}, testMsg:'Responde solo: hola', ui:{} };
const provName = id => AI_PROV[id]?.label || id || '';

async function api(path, { method='GET', body } = {}) {
  const user = auth.currentUser;
  if (!user || user.uid !== OWNER_UID) throw new Error('Ingresa con tu PIN para continuar.');
  const token = await user.getIdToken();
  let r;
  try { r = await fetch(WORKER_URL + path, { method, body: body ? JSON.stringify(body) : undefined,
    headers: { Authorization: 'Bearer ' + token, ...(body ? { 'Content-Type':'application/json' } : {}) } }); }
  catch { throw new Error('No se pudo conectar con el Worker. Revisa tu conexión.'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(data.error || 'El Worker respondió ' + r.status); e.status = r.status; e.detalle = data.detalle; throw e; }
  return data;
}

// Form state keeps numbers as typed text; fromDraft validates like the Worker does.
const aiToDraft = c => ({ principal:{...c.principal}, respaldo: c.respaldo ? {...c.respaldo} : null, favoritos:(c.favoritos||[]).map(f=>({...f})),
  temperature: c.parametros?.temperature ?? '', top_p: c.parametros?.top_p ?? '', max_tokens: c.parametros?.max_tokens ?? '',
  extra: c.extra && Object.keys(c.extra).length ? JSON.stringify(c.extra, null, 2) : '' });
function aiFromDraft(d) {
  const err = {}, parametros = {};
  for (const [k,[lo,hi]] of Object.entries(AI_RANGES)) {
    const raw = String(d[k] ?? '').trim().replace(',', '.'); if (!raw) continue;
    const n = Number(raw);
    if (!Number.isFinite(n) || n < lo || n > hi || (k === 'max_tokens' && !Number.isInteger(n)))
      err[k] = k === 'max_tokens' ? `Escribe un número entero entre ${lo} y ${hi.toLocaleString('es')}.` : `Escribe un número entre ${lo} y ${hi}.`;
    else parametros[k] = n;
  }
  let extra = {}; const ex = String(d.extra || '').trim();
  if (ex) {
    try { extra = JSON.parse(ex); if (!extra || typeof extra !== 'object' || Array.isArray(extra)) throw 0;
      const bad = Object.keys(extra).find(k => AI_RESERVED.includes(k));
      if (bad) err.extra = `"${bad}" lo controla el Worker; quítalo de aquí.`;
      else if (JSON.stringify(extra).length > 2000) err.extra = 'Es demasiado largo (máximo 2000 caracteres).';
    } catch { err.extra = 'Debe ser un objeto JSON, por ejemplo {"top_k": 40}.'; }
  }
  if (!d.principal?.modelo) err.principal = 'Elige un modelo principal.';
  return { config:{ principal:d.principal, respaldo:d.respaldo, parametros, extra, favoritos:d.favoritos }, err };
}
const aiDirty = () => !!AI.draft && JSON.stringify(aiFromDraft(AI.draft).config) !== AI.saved;
function aiSetSaved(config) { AI.draft = aiToDraft(config); AI.saved = JSON.stringify(aiFromDraft(AI.draft).config); }

// Readable reason for a provider failure, with a hint in Spanish.
function aiReason(f) {
  const st = Number(String(f.error || '').match(/respondió (\d{3})/)?.[1]);
  const raw = typeof f.detalle === 'string' ? f.detalle : '';
  const msg = (raw.match(/"message"\s*:\s*"((?:[^"\\]|\\.)*)"/)?.[1] || raw).replace(/\\n/g, ' ').replace(/\\"/g, '"').trim().slice(0, 220);
  let hint = { 400:'El proveedor rechazó la petición; revisa los parámetros.', 401:'La clave no es válida; revísala en Cloudflare.', 402:'No hay saldo en el proveedor.',
    403:'La clave no tiene permiso para este modelo.', 404:'El modelo no está disponible o fue retirado; elige otro.', 429:'Se alcanzó el límite de uso; espera un momento o usa el respaldo.' }[st];
  if (/api key/i.test(msg)) hint = 'La clave no es válida; revísala en Cloudflare.';
  return [hint || f.error || 'Error desconocido', msg && msg !== hint ? `(${msg})` : ''].filter(Boolean).join(' ');
}

function openAI() {
  if (!S.isOwner) { showLock(true); return; }
  if (AI.loaded && !aiDirty()) AI.loaded = false; // refresh provider status on each visit unless there are unsaved edits

}
async function aiLoad() {
  if (AI.loading) return; AI.loading = true; AI.err = null;
  try {
    const [p, c] = await Promise.all([api('/ia/proveedores'), api('/config/ia')]);
    AI.prov = Object.fromEntries(p.proveedores.map(x => [x.id, x])); aiSetSaved(c.config); AI.loaded = true;
  } catch (e) { AI.err = e.message; }
  finally { AI.loading = false; aiPaint(); }
}

// Updates error messages and the save bar without redrawing the form (keeps focus and keyboard).
function aiCheck(showAll=false) {
  const { err } = aiFromDraft(AI.draft); const ui = AI.ui;
  for (const k of ['temperature','top_p','max_tokens','extra']) if (ui.err?.[k]) ui.err[k].textContent = err[k] || '';
  if (ui.state) {
    const n = Object.keys(err).filter(k => k !== 'principal').length;

    ui.state.textContent = n ? 'Revisa los campos marcados' : aiDirty() ? 'Cambios sin guardar' : 'Todo guardado';
  }
  if (showAll && err.principal) toast(err.principal);
  return err;
}

async function aiSave(btn) {
  const err = aiCheck(true); if (Object.keys(err).length) { if (!err.principal) toast('Revisa los campos marcados'); return; }

  try { const r = await api('/config/ia', { method:'PUT', body: aiFromDraft(AI.draft).config }); aiSetSaved(r.config); toast('Configuración guardada'); aiPaint(); }
  catch (e) { toast(e.message); btn.disabled = false; btn.textContent = 'Guardar'; }

async function aiTest(btn, out) {
  const err = aiCheck(); const { config } = aiFromDraft(AI.draft);
  if (Object.keys(err).length) { out.replaceChildren(h('div',{class:'ai-out err'}, h('b',{text: err.principal || 'Revisa los campos marcados antes de probar.'}))); return; }
  const msg = AI.testMsg.trim() || 'Responde solo: hola';
  btn.disabled = true; out.replaceChildren(h('p',{class:'hint',style:{margin:'0 0 14px'},text:'Esperando respuesta…'}));
  const t0 = performance.now();
  try {
    const r = await api('/ia/chat', { method:'POST', body:{ mensajes:[{ role:'user', content:msg }], config } });
    const secs = ((performance.now() - t0) / 1000).toLocaleString('es', { minimumFractionDigits:1, maximumFractionDigits:1 });
    const box = h('div',{class:'ai-out ok'}, h('b',{text:`Respondió ${r.modelo} (${provName(r.proveedor)}) en ${secs} s`}));
    if (r.fallos?.length) box.append(h('p',{text:`El principal falló: ${aiReason(r.fallos[0])} Respondió el respaldo.`}));
    box.append(h('div',{class:'ai-text',text:r.texto}));
    out.replaceChildren(box);
  } catch (e) {
    const fails = Array.isArray(e.detalle) ? e.detalle : null;
    const box = h('div',{class:'ai-out err'}, h('b',{text: fails ? (fails.length > 1 ? 'Ningún modelo respondió' : 'El modelo no respondió') : e.message}));
    (fails || []).forEach(f => box.append(h('p',{text:`${f.modelo || 'Sin modelo'} (${provName(f.proveedor)}): ${aiReason(f)}`})));
    out.replaceChildren(box);
  } finally { btn.disabled = false; }
}

  const paintSeg = () => seg.replaceChildren(...Object.entries(AI_PROV).map(([id, p]) =>
    h('button',{type:'button','aria-pressed':String(prov === id),onclick:()=>{ if (prov !== id) { prov = id; paintSeg(); load(); } }},

    if (all) info.textContent = !hits.length && !favs.length ? (ql ? 'Ningún modelo coincide.' : 'Este proveedor no devolvió modelos.')

  };
  const load = async (force=false) => {

  scr.append(top, head, body);
  ed = it.format==='rich' ? richEditor(body, it) : it.format==='md' ? mdEditor(body, it) : codeEditor(body, it);
  updateMeta();
}
function updateMeta(state) {
  const m = $('#edMeta'); if (!m || !ed) return; const it = get(S.fileId); if (!it) return;
  m.innerHTML = '';
  m.append(h('span',{class:'pill',html:fmtIcon(it).replace('width="22" height="22"','width="14" height="14"')}, it.format==='code' ? langInfo(it.lang)[1] : FORMATS[it.format].label));
  if (!S.canWrite) m.append(h('span',{text:'Solo lectura'}));
  else { const st = state || (S.dirty ? 'busy' : 'ok');
    m.append(h('span',{}, h('span',{class:'save-dot'+(st==='busy'?' busy':st==='err'?' err':'')}), ' ', st==='busy' ? 'Guardando…' : st==='err' ? 'Error al guardar' : 'Guardado')); }
  m.append(h('span',{text:ed.stats()}));
}
function changed() { if (!S.canWrite) return; S.dirty = true; updateMeta('busy'); clearTimeout(saveT); saveT = setTimeout(flushSave, 700); }
function flushSave() {
  clearTimeout(saveT); if (!S.dirty || !S.fileId || !ed || !get(S.fileId)) return; const id = S.fileId; const content = ed.getContent(); S.dirty = false;
  if (content === S.lastSaved) { updateMeta('ok'); return; }
  S.lastSaved = content;
  Store.patch(id, {content, updated:Date.now()}).then(()=>{ if (S.fileId===id && !S.dirty) updateMeta('ok'); }).catch(()=>{ S.dirty = true; S.lastSaved = null; updateMeta('err'); });
}
let richRefresh = null;
document.addEventListener('selectionchange', () => { if (richRefresh) richRefresh(); });
const tb = (iconOrHtml, label, fn, cls='') => h('button',{class:'tb '+cls,type:'button','aria-label':label,title:label,html:ICON[iconOrHtml]||iconOrHtml,onmousedown:e=>e.preventDefault(),onclick:fn});
const tsep = () => h('span',{class:'tsep'});

/* Rich text */
function richEditor(host, it) {
  const area = h('div',{class:'rich prose pad',contenteditable:String(S.canWrite),spellcheck:'true','data-ph':'Empieza a escribir o pega tu texto aquí…'});
  area.innerHTML = DOMPurify.sanitize(it.content||'', {ADD_ATTR:['data-check','data-checked']});
  let saved = null;
  const saveRange = () => { const s = getSelection(); if (s.rangeCount && area.contains(s.anchorNode)) saved = s.getRangeAt(0).cloneRange(); };
  const restoreRange = () => { area.focus({preventScroll:true}); if (!saved) return; const s = getSelection(); s.removeAllRanges(); s.addRange(saved); };
  const exec = (c, v=null) => { area.focus({preventScroll:true}); document.execCommand('styleWithCSS', false, true); document.execCommand(c, false, v); changed(); refresh(); };
  const block = tag => { const cur = String(document.queryCommandValue('formatBlock')).toLowerCase(); exec('formatBlock', cur===tag ? 'p' : tag); };
  const fixColors = () => { area.querySelectorAll('[style]').forEach(el => {
    TEXT_COLORS.forEach((k,i) => { if (el.style.color === sentinelRgb('fg',i)) el.style.color = `var(--${k})`; });
    HI_COLORS.forEach((k,i) => { if (el.style.backgroundColor === sentinelRgb('bg',i)) el.style.backgroundColor = `var(--${k})`; }); }); };
  const colorSheetRich = () => { saveRange();
    const mk = (kind, list, label) => { const sw = h('div',{class:'swatches'});
      sw.append(h('button',{class:'sw none',type:'button','aria-label':'Quitar '+label,onclick:()=>{ closeSheet(); restoreRange();
        if (kind==='fg') exec('foreColor', getComputedStyle(area).color); else exec('hiliteColor','transparent'); }},'—'));
      list.forEach((k,i) => sw.append(h('button',{class:'sw',type:'button','aria-label':label,style:{background:`var(--${k})`},onclick:()=>{ closeSheet(); restoreRange();
        exec(kind==='fg'?'foreColor':'hiliteColor', sentinelFor(kind,i)); fixColors(); changed(); }})));
      return sw; };
    openSheet({ title:'Color', body:[h('div',{class:'field'}, h('label',{text:'Color de texto'}), mk('fg',TEXT_COLORS,'Color de texto')), h('div',{class:'field'}, h('label',{text:'Resaltado'}), mk('bg',HI_COLORS,'Resaltado'))] }); };
  const linkSheet = () => { saveRange(); const inp = h('input',{class:'input',type:'url',id:'linkIn',placeholder:'https://…',autocomplete:'off'});
    openSheet({ title:'Insertar enlace', confirm:'Aplicar', focus:inp, body:[h('div',{class:'field'}, h('label',{for:'linkIn',text:'Dirección'}), inp)],
      onConfirm: () => { let u = inp.value.trim(); if (!u) return false; if (!/^https?:\/\//i.test(u)) u = 'https://' + u; closeSheet(); setTimeout(()=>{ restoreRange(); exec('createLink', u); }, 40); return false; } }); };
  const B = { bold:tb('<b>B</b>','Negrita',()=>exec('bold')), italic:tb('<i style="font-family:Georgia,serif">I</i>','Cursiva',()=>exec('italic')),
    underline:tb('<u>U</u>','Subrayado',()=>exec('underline')), strike:tb('<s>S</s>','Tachado',()=>exec('strikeThrough')) };
  const pasteBtn = tb('<span style="font-size:13px;font-weight:600">Texto plano</span>','Pegar sin formato',()=>{ S.pastePlain = !S.pastePlain; pasteBtn.classList.toggle('on', S.pastePlain); toast(S.pastePlain ? 'Pegarás solo el texto' : 'Pegarás con formato'); }, 'txt'+(S.pastePlain?' on':''));
  const tools = h('div',{class:'ed-tools',role:'toolbar','aria-label':'Formato'},
    tb('undo','Deshacer',()=>exec('undo')), tb('redo','Rehacer',()=>exec('redo')), tsep(),
    tb('<span style="font-family:var(--f-display);font-weight:700">T1</span>','Título',()=>block('h1')), tb('<span style="font-family:var(--f-display);font-weight:700">T2</span>','Subtítulo',()=>block('h2')), tb('<span style="font-weight:600">¶</span>','Párrafo',()=>exec('formatBlock','p')), tsep(),
    B.bold, B.italic, B.underline, B.strike, tb('palette','Color y resaltado',colorSheetRich), tsep(),
    tb('list','Lista',()=>exec('insertUnorderedList')), tb('olist','Lista numerada',()=>exec('insertOrderedList')),
    tb('check','Lista de tareas',()=>exec('insertHTML','<ul data-check=""><li data-checked="false">Nueva tarea</li></ul><p><br></p>')),
    tb('quote','Cita',()=>block('blockquote')), tb('code','Bloque de código',()=>block('pre')), tb('link','Enlace',linkSheet), tb('hr','Línea divisoria',()=>exec('insertHorizontalRule')),
    tb('clear','Quitar formato',()=>{ exec('removeFormat'); exec('unlink'); }), tsep(), pasteBtn);
  const refresh = () => { [['bold',B.bold],['italic',B.italic],['underline',B.underline],['strikeThrough',B.strike]].forEach(([c,b]) => { try { b.classList.toggle('on', document.queryCommandState(c)); } catch {} }); };
  richRefresh = () => { if (area.isConnected && area.contains(getSelection().anchorNode)) refresh(); };
  area.addEventListener('input', changed);
  area.addEventListener('blur', flushSave);
  area.addEventListener('click', e => { const li = e.target.closest('ul[data-check] > li'); if (!li || !S.canWrite) return;
    const r = li.getBoundingClientRect(); if (e.clientX - r.left < 30) { li.dataset.checked = li.dataset.checked==='true' ? 'false' : 'true'; changed(); } });
  area.addEventListener('keydown', e => { if (e.key==='Tab') { e.preventDefault(); exec(e.shiftKey?'outdent':'indent'); } if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k') { e.preventDefault(); linkSheet(); } });
  area.addEventListener('paste', e => { const cd = e.clipboardData; if (!cd || !S.canWrite) return; e.preventDefault();
    const html = cd.getData('text/html'); const txt = cd.getData('text/plain');
    if (!S.pastePlain && html) document.execCommand('insertHTML', false, DOMPurify.sanitize(html, {FORBID_TAGS:['style','meta','font','script','iframe','form','input','button'], FORBID_ATTR:['style','class','id','width','height','bgcolor','color','face','size']}));
    else document.execCommand('insertText', false, txt);
    changed(); });
  host.append(area); if (S.canWrite) host.append(tools);
  return { getContent:()=>area.innerHTML, setContent:v=>{ area.innerHTML = DOMPurify.sanitize(v,{ADD_ATTR:['data-check','data-checked']}); },
    isFocused:()=>area.contains(document.activeElement)||document.activeElement===area, text:()=>area.innerText,
    stats:()=>{ const n = countWords(area.innerText||''); return `${n.toLocaleString('es')} palabra${n===1?'':'s'}`; } };
}

/* Markdown */
function insertAround(ta, before, after='', placeholder='texto') {
  const s=ta.selectionStart, e=ta.selectionEnd; const sel=ta.value.slice(s,e) || placeholder; const ins = before+sel+after;
  ta.focus(); ta.setSelectionRange(s,e); if (!document.execCommand('insertText', false, ins)) { ta.setRangeText(ins, s, e, 'end'); ta.dispatchEvent(new Event('input')); }
  ta.setSelectionRange(s+before.length, s+before.length+sel.length);
}
function prefixLines(ta, prefix) {
  const v=ta.value; let s=ta.selectionStart, e=ta.selectionEnd; s=v.lastIndexOf('\n', s-1)+1; const nl=v.indexOf('\n', e); e = nl===-1 ? v.length : nl;
  const lines=v.slice(s,e).split('\n'); const all=lines.every(l=>l.startsWith(prefix));
  const out=lines.map((l,i)=> all ? l.slice(prefix.length) : (prefix==='1. ' ? (i+1)+'. ' : prefix)+l).join('\n');
  ta.focus(); ta.setSelectionRange(s,e); if (!document.execCommand('insertText', false, out)) { ta.setRangeText(out,s,e,'end'); ta.dispatchEvent(new Event('input')); }
}
function renderMd(src, target) {
  target.innerHTML = DOMPurify.sanitize(marked.parse(src||'', {gfm:true, breaks:true}));
  target.querySelectorAll('a').forEach(a=>{ a.target='_blank'; a.rel='noopener'; });
  target.querySelectorAll('pre code').forEach(c=>{ try { hljs.highlightElement(c); } catch {} });
  target.querySelectorAll('input[type=checkbox]').forEach(c=>c.disabled=true);
  if (!String(src).trim()) target.innerHTML = '<p style="color:var(--muted)">La vista previa aparecerá aquí.</p>';
}
function mdEditor(host, it) {
  const wide = matchMedia('(min-width:1100px)').matches;
  let mode = (!S.canWrite) ? 'view' : (S.mdMode==='split' && !wide ? 'edit' : S.mdMode);
  const wrap = h('div',{class:'md-wrap'});
  const ta = h('textarea',{class:'md-src pad',spellcheck:'true','aria-label':'Texto Markdown',placeholder:'# Título\n\nEscribe en Markdown…',readonly:!S.canWrite}); ta.value = it.content||'';
  const prev = h('div',{class:'md-prev prose pad'});
  const opts = [['edit','Editar'],['view','Vista']]; if (wide) opts.push(['split','Dividido']);
  const seg = h('div',{class:'seg',role:'group','aria-label':'Modo de vista'}, ...opts.map(([m,l]) => h('button',{'data-m':m,onclick:()=>{ mode=m; S.mdMode=m; remember(); apply(); if (m!=='view') ta.focus(); }}, l)));
  const apply = () => { wrap.classList.toggle('split', mode==='split'); ta.classList.toggle('hide', mode==='view'); prev.classList.toggle('hide', mode==='edit');
    seg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.m===mode))); if (mode!=='edit') renderMd(ta.value, prev); };
  let pt; const rerender = () => { clearTimeout(pt); pt = setTimeout(()=>{ if (mode!=='edit') renderMd(ta.value, prev); }, 140); };
  const tools = h('div',{class:'ed-tools',role:'toolbar','aria-label':'Formato Markdown'}, seg, tsep(),
    tb('<span style="font-family:var(--f-display);font-weight:700">H1</span>','Título',()=>prefixLines(ta,'# ')), tb('<span style="font-family:var(--f-display);font-weight:700">H2</span>','Subtítulo',()=>prefixLines(ta,'## ')),
    tb('<b>B</b>','Negrita',()=>insertAround(ta,'**','**')), tb('<i style="font-family:Georgia,serif">I</i>','Cursiva',()=>insertAround(ta,'*','*')),
    tb('list','Lista',()=>prefixLines(ta,'- ')), tb('olist','Lista numerada',()=>prefixLines(ta,'1. ')), tb('check','Tarea',()=>prefixLines(ta,'- [ ] ')),
    tb('quote','Cita',()=>prefixLines(ta,'> ')), tb('code','Bloque de código',()=>insertAround(ta,'\n```python\n','\n```\n','print("hola")')),
    tb('table','Tabla',()=>insertAround(ta,'\n| Columna 1 | Columna 2 |\n|---|---|\n| ','| valor |\n','valor ')), tb('link','Enlace',()=>insertAround(ta,'[','](https://)','texto')));
  ta.addEventListener('input', () => { changed(); rerender(); });
  ta.addEventListener('blur', flushSave);
  ta.addEventListener('keydown', e => { if (e.key==='Tab') { e.preventDefault(); insertAround(ta,'    ','',''); } });
  wrap.append(ta, prev); host.append(wrap); if (S.canWrite) host.append(tools); apply();
  return { getContent:()=>ta.value, setContent:v=>{ ta.value=v; if (mode!=='edit') renderMd(v, prev); }, isFocused:()=>document.activeElement===ta, text:()=>ta.value,
    stats:()=>{ const n = countWords(ta.value); return `${n.toLocaleString('es')} palabra${n===1?'':'s'}`; } };
}

/* Code */
function codeEditor(host, it) {
  const wrap = h('div',{class:'code-wrap'+(S.wrap?' wrapl':'')});
  const pre = h('pre',{'aria-hidden':'true'}); const code = h('code',{class:'hljs'}); pre.append(code);
  const ta = h('textarea',{spellcheck:'false',autocapitalize:'off',autocomplete:'off','aria-label':'Código',wrap:S.wrap?'soft':'off',readonly:!S.canWrite}); ta.value = it.content||'';
  const lang = h('select',{'aria-label':'Lenguaje',disabled:!S.canWrite}); LANGS.forEach(([v,l])=>lang.append(h('option',{value:v},l))); lang.value = it.lang || 'python';
  const paint = () => { let v = ta.value; if (v.endsWith('\n') || !v) v += ' '; const L = lang.value;
    try { code.innerHTML = (L!=='plaintext' && hljs.getLanguage(L)) ? hljs.highlight(v,{language:L, ignoreIllegals:true}).value : v.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); } catch { code.textContent = v; } };
  const sync = () => { pre.scrollTop = ta.scrollTop; pre.scrollLeft = ta.scrollLeft; };
  lang.addEventListener('change', () => { Store.patch(S.fileId, {lang:lang.value, updated:Date.now()}); paint(); updateMeta(); });
  const wrapBtn = tb('<span style="font-size:13px;font-weight:600">Ajustar líneas</span>','Ajuste de línea',()=>{ S.wrap=!S.wrap; remember(); wrap.classList.toggle('wrapl',S.wrap); ta.setAttribute('wrap', S.wrap?'soft':'off'); wrapBtn.classList.toggle('on',S.wrap); sync(); }, 'txt'+(S.wrap?' on':''));
  const tools = h('div',{class:'ed-tools',role:'toolbar','aria-label':'Opciones de código'}, h('span',{class:'tb'}, lang), tsep(),
    tb('<span style="font-size:13px;font-weight:600">Comentar</span>','Comentar líneas',()=>{ const pfx = ({python:'# ',r:'# ',bash:'# ',sql:'-- '})[lang.value] || '// '; prefixLines(ta, pfx); }, 'txt'),
    tb('<span style="font-size:13px;font-weight:600">Sangría</span>','Aumentar sangría',()=>prefixLines(ta,'    '), 'txt'),
    tb('<span style="font-family:var(--f-mono);font-size:14px">{ }</span>','Insertar llaves',()=>insertAround(ta,'{','}','')),
    tb('<span style="font-family:var(--f-mono);font-size:14px">( )</span>','Insertar paréntesis',()=>insertAround(ta,'(',')','')), tsep(), wrapBtn);
  ta.addEventListener('input', () => { paint(); sync(); changed(); });
  ta.addEventListener('scroll', sync);
  ta.addEventListener('blur', flushSave);
  ta.addEventListener('keydown', e => {
    if (e.key==='Tab') { e.preventDefault(); if (ta.selectionStart!==ta.selectionEnd) prefixLines(ta,'    '); else insertAround(ta,'    ','',''); }
    if (e.key==='Enter') { const v=ta.value, s=ta.selectionStart; const ls=v.lastIndexOf('\n', s-1)+1; const ind=(v.slice(ls,s).match(/^[ \t]*/)||[''])[0];
      const extra = /[:{\[(]\s*$/.test(v.slice(ls,s)) ? '    ' : ''; if (ind||extra) { e.preventDefault(); insertAround(ta,'\n'+ind+extra,'',''); } }
  });
  wrap.append(pre, ta); host.append(wrap); if (S.canWrite) host.append(tools); paint();
  return { getContent:()=>ta.value, setContent:v=>{ ta.value=v; paint(); }, isFocused:()=>document.activeElement===ta, text:()=>ta.value,
    stats:()=>{ const n = ta.value.split('\n').length; return `${n} línea${n===1?'':'s'}`; } };
}

/* ================= File actions ================= */
function saveBlob(filename, data, type) {
  const u = URL.createObjectURL(new Blob([data], {type})); const a = h('a',{href:u, download:filename});
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 3000);
}
function htmlDoc(title, body) { return `<!doctype html><html lang="es"><head><meta charset="utf-8"><title>${title.replace(/</g,'&lt;')}</title><style>body{font-family:system-ui,sans-serif;max-width:72ch;margin:40px auto;padding:0 16px;line-height:1.6}pre{background:#f2f4f1;padding:12px;border-radius:8px;overflow:auto}blockquote{border-left:3px solid #1d5c46;margin:0;padding-left:1em;color:#555}</style></head><body>${body}</body></html>`; }
function fileExport(id) { if (S.view==='editor') flushSave(); const it = get(id); if (!it) return;
  const base = it.name.replace(/\.[a-z0-9]{1,5}$/i,'').replace(/[\\/:*?"<>|]+/g,'-').trim() || 'nota';
  let filename, data;
  if (it.format==='rich') { filename = base+'.html'; data = htmlDoc(it.name, DOMPurify.sanitize(it.content||'')); }
  else if (it.format==='md') { filename = base+'.md'; data = it.content||''; }
  else { filename = base+'.'+langInfo(it.lang)[2]; data = it.content||''; }
  saveBlob(filename, data, 'text/plain;charset=utf-8'); toast('Descargado: '+filename);
}
function convertTo(id, fmt) { if (S.view==='editor') flushSave(); const it = get(id); if (!it || it.format===fmt) return;
  let content = it.content||'';
  if (it.format==='rich') content = plainOf(it);
  if (fmt==='rich') content = it.format==='md' ? DOMPurify.sanitize(marked.parse(content,{gfm:true,breaks:true})) : '<pre><code>'+content.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</code></pre>';
  if (fmt==='md' && it.format==='code') content = '```'+(it.lang||'')+'\n'+content+'\n```\n';
  const part = {format:fmt, content, updated:Date.now()}; if (fmt==='code') part.lang = it.lang || 'python';
  Store.patch(id, part); toast('Convertido a '+FORMATS[fmt].long);
  if (S.view==='editor' && S.fileId===id) render(); else onData();
}
function backup() { if (S.view==='editor') flushSave(); const d = new Date().toISOString().slice(0,10);
  saveBlob('bitacora-respaldo-' + d + '.json', JSON.stringify({app:'bitacora', version:2, exported:Date.now(), items:Object.fromEntries(S.items)}, null, 2), 'application/json');
  toast('Respaldo descargado'); }
function restore() {
  const inp = h('input',{type:'file',accept:'.json,application/json'});
  inp.onchange = async () => { const f = inp.files[0]; if (!f) return; let data;
    try { data = JSON.parse(await f.text()); } catch { toast('El archivo no es un respaldo válido.'); return; }
    const items = data && data.items; if (!items || typeof items !== 'object') { toast('El archivo no es un respaldo de Bitácora.'); return; }
    const ids = Object.keys(items).filter(id => /^[A-Za-z0-9_-]{1,100}$/.test(id) && items[id] && ['file','folder','clip'].includes(items[id].type));
    if (!ids.length) { toast('El respaldo no contiene notas.'); return; }
    openSheet({ title:'Restaurar respaldo', confirm:'Restaurar', body:[h('p',{text:`Se restaurarán ${ids.length} elementos. Los que ya existan se reemplazarán por la versión del respaldo; el resto de tus notas no cambia.`})],
      onConfirm: async () => { try { for (let i = 0; i < ids.length; i += 400) { const b = fdb.batch(); ids.slice(i, i+400).forEach(id => b.set(Store.col.doc(id), items[id])); await b.commit(); } toast('Respaldo restaurado'); }
        catch (e) { toast('No se pudo restaurar (' + (e.code||'error') + ').'); } } });
  };
  inp.click();
}
function loadExamples() {
  const now = Date.now(); const f1 = uid();
  Store.set(f1, {type:'folder', name:'Ejemplos', parent:null, color:'c4', created:now, updated:now});
  Store.set(uid(), {type:'file', parent:f1, format:'rich', name:'Bienvenida (ejemplo)', created:now, updated:now, content:'<h1>Tu Bitácora</h1><p>Usa la barra de abajo para dar formato: <b>negrita</b>, <span style="background-color: var(--hc0)">resaltado</span> y listas.</p><ul data-check=""><li data-checked="true">Crear una carpeta</li><li data-checked="false">Pegar mis apuntes</li></ul>'});
  Store.set(uid(), {type:'file', parent:f1, format:'md', name:'Guía de Markdown (ejemplo)', created:now, updated:now, content:'# Guía rápida\n\n- **Negrita** con `**texto**`\n- *Cursiva* con `*texto*`\n\n| Comando | Uso |\n|---|---|\n| `SELECT` | Leer filas |\n'});
  Store.set(uid(), {type:'file', parent:f1, format:'code', lang:'python', name:'promedio.py (ejemplo)', created:now, updated:now, content:'def promedio(valores):\n    return sum(valores) / len(valores) if valores else 0.0\n\nprint(promedio([8.5, 9.0, 7.25, 10]))\n'});
  onData(); toast('Se cargaron 3 notas de ejemplo');
}

/* ================= Global wiring ================= */
document.addEventListener('keydown', e => { if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s') { e.preventDefault(); if (S.view==='editor' && S.canWrite) { S.dirty = true; flushSave(); toast('Guardado'); } } });
document.addEventListener('visibilitychange', () => { if (document.hidden) flushSave(); });
window.addEventListener('pagehide', flushSave);
setInterval(() => { if (S.view==='editor' && !S.dirty) updateMeta(); }, 30000);

history.replaceState({ view:'home', depth:0 }, '');
render();
auth.onAuthStateChanged(u => { S.isOwner = !!u && u.uid === OWNER_UID; S.authKnown = true; if (u && !S.isOwner) auth.signOut(); recompute(); });
fdb.doc('config/access').onSnapshot(snap => { const m = snap.exists ? snap.data().mode : 'private'; S.access = MODES[m] ? m : 'private'; recompute(); }, () => { S.access = 'private'; recompute(); });
})();
</script>
